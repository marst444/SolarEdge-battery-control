# ── emhass_restcommand.yaml ──
# Layer 2: rest_command HTTP endpoints for the local EMHASS addon (optim runs, publish, ML fit/predict).
# Sets: (HTTP calls only, no HA entities)
# Deps: EMHASS addon (127.0.0.1:5000), InfluxDB (192.168.10.3:8086)  →  emhass_scripts.yaml
# Fixes: known_issues_and_fixes.md; rest_command.publish_data possibly dead - see roadmap.md

rest_command:

# Siegen energy setup #
  emhass_dayahead_optim:
    url: http://127.0.0.1:5000/action/dayahead-optim
    method: POST
    content_type: "application/json"
    timeout: 240
    payload: "{{ payload }}"
  emhass_naive_mpc_optim:
    url: http://127.0.0.1:5000/action/naive-mpc-optim
    method: POST
    content_type: "application/json"
    timeout: 240
    payload: "{{ payload }}"
  emhass_publish_data:
    url: http://127.0.0.1:5000/action/publish-data
    method: POST
    content_type: "application/json"
    timeout: 240
    payload: "{{ payload }}"

  # Note: uses 192.168.10.3 (LAN IP) rather than 127.0.0.1 like the three
  # commands above, and is not currently called from emhass_scripts.yaml or
  # emhass_automations.yaml - listed in entities.md but not observed wired
  # into any automation in this audit's scope. Worth confirming whether it
  # is still needed.
  publish_data:
    url: http://192.168.10.3:5000/action/publish-data
    method: POST
    headers:
      Content-Type: application/json
    payload: '{}'


  mlforecast_fit_load:
    url: "http://192.168.10.3:5000/action/forecast-model-fit"
    method: POST
    timeout: 300
    headers:
      Content-Type: "application/json"
    payload: >
      {
        "historic_days_to_retrieve": 30,
        "model_type": "load_forecast",
        "var_model": "sensor.power_myhouse_load_no_var_loads_no_ev",
        "sklearn_model": "KNeighborsRegressor",
        "num_lags": 96,
        "split_date_delta": "48h",
        "perform_backtest": true,
        "retrieve_method": "influxdb",
        "influxdb_host": "192.168.10.3",
        "influxdb_port": 8086,
        "influxdb_dbname": "home_assistant",
        "influxdb_ssl": false,
        "influxdb_verify_ssl": false,
        "influxdb_measurement_attr": "last_state",
        "influxdb_measurement": "sensor.power_myhouse_load_no_var_loads_no_ev"
      }

  mlforecast_predict_load:
    url: "http://192.168.10.3:5000/action/forecast-model-predict"
    method: POST
    timeout: 60
    headers:
      Content-Type: "application/json"
    payload: >
      {
        "model_type": "load_forecast",
        "model_predict_publish": true,
        "var_model": "sensor.power_myhouse_load_no_var_loads_no_ev",
        "model_predict_entity_id": "sensor.p_load_forecast_ml_pv",
        "model_predict_unit_of_measurement": "W",
        "model_predict_friendly_name": "Load Power Forecast ML PV",
        "retrieve_method": "influxdb",
        "influxdb_host": "192.168.10.3",
        "influxdb_port": 8086,
        "influxdb_dbname": "home_assistant",
        "influxdb_ssl": false,
        "influxdb_verify_ssl": false,
        "influxdb_measurement_attr": "last_state",
        "influxdb_measurement": "sensor.power_myhouse_load_no_var_loads_no_ev"
      }