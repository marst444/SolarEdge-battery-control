            ev:
              planning_energy: sensor.ev_planning_energy_needed_kwh
              nominal_power: sensor.emhass_ev_nominal_charging_power_w
              minimum_power: sensor.emhass_ev_minimum_charging_power_w
              departure: sensor.ev_effective_departure

        alias: Configure sensor entities

      - variables:
          num_forecasts: '{{ (60 / optimization_time_step * 24 * num_prediction_days) | int }}'
          soc_init: '{{ (states(sensors.battery_soc) | float(0) / 100) | round(3) }}'
          soc_final: '{{ battery_minimum_percent / 100 }}'
          now_iso: '{{ now().replace(microsecond=0).isoformat() }}'
          # Already Watts - input_number.emhass_max_inverter_power, unlike the
