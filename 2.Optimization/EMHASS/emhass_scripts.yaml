# ── emhass_scripts.yaml ──
# Layer 2: builds EMHASS MPC/day-ahead optimisation payloads from live sensors, calls the addon, publishes forecast sensors back into HA.
# Sets: sensor.mpc_pv_*/dh_pv_*
# Deps: SolarEdge/Solcast/merged price sensors, rest_command.emhass_*  →  emhass_automations.yaml, battery_forecast_control.yaml
# Fixes: known_issues_and_fixes.md. 2026-11-02: removed dead pre-refactor
# sliding-window scripts (emhass_update_sliding_window, set_mpc_soc_final_target)
# - unused since the MPC/day-ahead redesign, confirmed dead (last_triggered
# 2026-07-09, referenced input_datetime.day_ahead_forecast_end and the
# now-removed mpc_window_start/end/prediction_horizon/soc_final_target
# helpers, and one referenced sensor.soc_batt_forecast which returns
# ENTITY_NOT_FOUND). See known_issues_and_fixes.md and roadmap.md
# Cleanup/Technical Debt. The 4 purely-registry "ghost" automations that
# used to call these scripts (automation.emhass_day_ahead_optimization,
# automation.emhass_update_sliding_window, automation.emhass_mpc,
# script.run_mpc_optimization) have no YAML backing in this project at all
# and must be deleted manually via the HA UI (Settings > Devices & Services
# > Entities, filter "unavailable").

# Sensors used by the MPC and day-ahead scripts below: energy capacity (kWh),
# charging/discharging power (W), battery SOC (%), house load excl. variable
# loads (W), current PV power (W), import/export price (SEK/kWh). Max
# inverter power (W) is NOT a live sensor - as of 2026-10-11 it's the static
# input_number.emhass_max_inverter_power helper (emhass_helpers.yaml), not
# sensor.max_active_power_1 - see known_issues_and_fixes.md, EMHASS Rejects
# Optimisation Requests When sensor.max_active_power_1 Goes Unavailable, for
# why that cloud-sourced entity was removed from this critical path. The
# load forecast used in the payload comes from EMHASS's own ML predict step,
# published to sensor.p_load_forecast_ml_pv.
# Both scripts are a modification of Brendan Annable's Sigenergy script -
# see README.md (Big thanks) for attribution/details.

script:

  generate_emhass_energy_plan_mpc_pv:
    alias: "generate EMHASS energy plan MPC_PV"
    sequence:
      - variables:
          costfun: profit
          maximum_power_from_grid: 15000
          maximum_power_to_grid: 5000
          battery_minimum_percent: "{{ states('input_number.minimum_state_of_charge') | float(20) }}"
        alias: Configure critical settings
      - variables:
          num_prediction_days: 2
          optimization_time_step: 15
          weight_battery_charge: 0.02
          weight_battery_discharge: 0.02
          sensor_prefix: mpc_pv_
          sensor_name_prefix: 'MPC_PV '
          number_of_deferrable_loads: 1
        alias: Configure secondary settings
      - variables:

          sensors:
            energy_capacity: sensor.solaredge_b1_maximum_energy
            charging_power: sensor.solaredge_b1_max_charge_power
            discharging_power: sensor.solaredge_b1_max_discharge_power
            max_inverter_power: input_number.emhass_max_inverter_power
            battery_soc: sensor.solaredge_b1_state_of_energy
            consumed_power: sensor.power_myhouse_load_no_var_loads_no_ev
            solar:
              current_power: sensor.solar_panel_production_w
              forecasts:
              - sensor.solcast_pv_forecast_forecast_today
              - sensor.solcast_pv_forecast_forecast_tomorrow
              - sensor.solcast_pv_forecast_forecast_day_3
            prices:
              import: sensor.merged_total_costs_import_forecast
              export: sensor.merged_total_revenue_export_forecast
            ev:
              planning_energy: sensor.ev_planning_energy_needed_kwh
              nominal_power: sensor.emhass_ev_nominal_charging_power_w
              minimum_power: sensor.emhass_ev_minimum_charging_power_w
              departure: sensor.ev_effective_departure

        alias: Configure sensor entities

      - variables:
          num_forecasts: '{{ (60 / optimization_time_step * 24 * num_prediction_days) | int }}'
          soc_init: '{{ (states(sensors.battery_soc) | float(0) / 100) | round(3) }}'
          soc_final: '{{ battery_minimum_percent / 100 }}'
          now_iso: '{{ now().replace(microsecond=0).isoformat() }}'
          # Already Watts - input_number.emhass_max_inverter_power, unlike the
          # old sensor.max_active_power_1 it replaced, is not in kW, so no
          # *1000 conversion here. See emhass_helpers.yaml for why this is a
          # static helper rather than a live sensor.
          max_inverter_power: '{{ (states(sensors.max_inverter_power) | float(10600)) | round }}'
          common:
            costfun: '{{ costfun }}'
            prediction_horizon: '{{ num_forecasts }}'
            optimization_time_step: '{{ optimization_time_step }}'
            delta_forecast_daily: '{{ num_prediction_days }}'
            set_use_adjusted_pv: false
            set_use_pv: true
            set_use_battery: true
            inverter_is_hybrid: true
            number_of_deferrable_loads: '{{ number_of_deferrable_loads }}'
            set_nodischarge_to_grid: false
            pv_power_forecast_method: 'list'
            load_cost_forecast_method: 'list'
            production_price_forecast_method: 'list'
          payload:
            weight_battery_charge: '{{ weight_battery_charge }}'
            weight_battery_discharge: '{{ weight_battery_discharge }}'
            battery_minimum_state_of_charge: '{{ battery_minimum_percent / 100 }}'
            battery_maximum_state_of_charge: "{{ states('input_number.maximum_state_of_charge') | float(90) / 100 }}"
            battery_nominal_energy_capacity: '{{ (states(sensors.energy_capacity) | float(0) * 1000) | round }}'
            battery_charge_power_max: '{{ (states(sensors.charging_power) | float(0)) | round }}'
            battery_discharge_power_max: '{{ (states(sensors.discharging_power) | float(0)) | round }}'
            maximum_power_from_grid: '{{ maximum_power_from_grid }}'
            maximum_power_to_grid: '{{ maximum_power_to_grid }}'
            inverter_ac_output_max: '{{ max_inverter_power }}'
            inverter_ac_input_max: '{{ max_inverter_power }}'
            soc_init: '{{ soc_init }}'
            soc_final: '{{ soc_final }}'
            nominal_power_of_deferrable_loads: >
              {{ [states(sensors.ev.nominal_power) | int(0)] }}
            minimum_power_of_deferrable_loads: >
              {{ [states(sensors.ev.minimum_power) | int(0)] }}
            operating_hours_of_each_deferrable_load: >
              {{ [states('sensor.ev_deferrable_total_hours') | float(0)] }}
            start_timesteps_of_each_deferrable_load: >
              {{ [states('sensor.ev_deferrable_start_timestep') | int(0)] }}
            end_timesteps_of_each_deferrable_load: >
              {{ [states('sensor.ev_deferrable_end_timestep') | int(0)] }}
            treat_deferrable_load_as_semi_cont: "{{ [false] }}"
            set_deferrable_load_single_constant: "{{ [false] }}"
            set_deferrable_startup_penalty: "{{ [0.5] }}"
            def_minimum_on_time: "{{ [4] }}"
            def_minimum_off_time: "{{ [2] }}"
            set_deferrable_max_startups: "{{ [2] }}"


            load_cost_forecast: |-
              {% set ns = namespace(output={}) %}
              {% for forecast in (state_attr(sensors.prices.import, 'forecast_merged') or []) %}
                {% set start = (forecast.ts.split(' - ')[0] | as_datetime | as_local).isoformat() %}
                {% set price = forecast.price | float(0) %}
                {% set ns.output = ns.output | combine({ start: price }) %}
              {% endfor %}
              {{ ns.output }}

            prod_price_forecast: |-
              {% set ns = namespace(output={}) %}
              {% for forecast in (state_attr(sensors.prices.export, 'forecast_merged') or []) %}
                {% set start = (forecast.ts.split(' - ')[0] | as_datetime | as_local).isoformat() %}
                {% set price = forecast.price | float(0) %}
                {% set ns.output = ns.output | combine({ start: price }) %}
              {% endfor %}
              {{ ns.output }}

            pv_power_forecast: |-
              {% set ns = namespace(
                input=sensors.solar.forecasts
                  | map('state_attr', 'detailedForecast')
                  | sum(start=[])
                  | selectattr('period_start', '>', now())
                  | selectattr('period_start', '<=', now() + timedelta(days=num_prediction_days)),
                output={
                  now_iso: (states(sensors.solar.current_power) | float(0)) | round(0)
                }
              ) %}
              {% for solar in ns.input %}
                {% set key = (solar.period_start | as_datetime | as_local).isoformat() %}
                {% set value = ((solar.pv_estimate | float(0)) * 1000) | round(0) %}
                {% set ns.output = ns.output | combine({ key: value }) %}
              {% endfor %}
              {{ ns.output }}
            load_power_forecast: |-
              {% set ml = state_attr('sensor.p_load_forecast_ml_pv', 'scheduled_forecast') or [] %}
              {% set ns = namespace(output={
                now_iso: (states(sensors.consumed_power) | float(0)) | round(0)
              }) %}
              {% for item in ml %}
                {% set ns.output = ns.output | combine({
                  item.date: (item.p_load_forecast_ml_pv | float(0)) | round(0)
                }) %}
              {% endfor %}
              {{ ns.output }}
        alias: Calculate payload
      - action: rest_command.emhass_naive_mpc_optim
        metadata: {}
        data:
          payload: >
            {{ dict(common, **payload) | to_json }}
        alias: Run EMHASS
      - variables:
          payload:
            custom_pv_forecast_id:
              entity_id: sensor.{{ sensor_prefix }}pv_power
              unit_of_measurement: W
              device_class: power
              friendly_name: '{{ sensor_name_prefix }}PV Power'
            custom_load_forecast_id:
              entity_id: sensor.{{ sensor_prefix }}load_power
              unit_of_measurement: W
              device_class: power
              friendly_name: '{{ sensor_name_prefix }}Load Power'
            custom_hybrid_inverter_id:
              entity_id: sensor.{{ sensor_prefix }}inverter_power
              unit_of_measurement: W
              device_class: power
              friendly_name: '{{ sensor_name_prefix }}Inverter Power'
            custom_batt_forecast_id:
              entity_id: sensor.{{ sensor_prefix }}batt_power
              unit_of_measurement: W
              device_class: power
              friendly_name: '{{ sensor_name_prefix }}Battery Power'
            custom_grid_forecast_id:
              entity_id: sensor.{{ sensor_prefix }}grid_power
              unit_of_measurement: W
              device_class: power
              friendly_name: '{{ sensor_name_prefix }}Grid Power'
            custom_batt_soc_forecast_id:
              entity_id: sensor.{{ sensor_prefix }}batt_soc
              unit_of_measurement: '%'
              device_class: battery
              friendly_name: '{{ sensor_name_prefix }}Battery SOC'
            custom_cost_fun_id:
              entity_id: sensor.{{ sensor_prefix }}cost_fun
              unit_of_measurement: $
              device_class: monetary
              friendly_name: '{{ sensor_name_prefix }}Cost Function'
            custom_unit_load_cost_id:
              entity_id: sensor.{{ sensor_prefix }}import_price
              unit_of_measurement: $
              device_class: monetary
              friendly_name: '{{ sensor_name_prefix }}Buy Price'
            custom_unit_production_price_id:
              entity_id: sensor.{{ sensor_prefix }}export_price
              unit_of_measurement: $
              device_class: monetary
              friendly_name: '{{ sensor_name_prefix }}Sell Price'
            custom_optim_status_id:
              entity_id: sensor.{{ sensor_prefix }}optim_status
              unit_of_measurement: ''
              friendly_name: '{{ sensor_name_prefix }}Optimisation Status'
            custom_deferrable_forecast_id:
              -  entity_id: sensor.{{ sensor_prefix }}ev_power
                 unit_of_measurement: W
                 device_class: power
                 friendly_name: '{{ sensor_name_prefix }}EV Power'
      - action: rest_command.emhass_publish_data
        metadata: {}
        data:
          payload: >
            {{ dict(common, **payload) | to_json }}
        alias: Publish Energy Plan to HA

  # Day-ahead energy plan: same sensor set and payload pattern as the MPC
  # script above, using EMHASS's dayahead-optim instead of naive-mpc-optim.
  # Triggered once per day by emhass_automations.yaml.
  generate_emhass_energy_plan_dh_pv:
    alias: "generate EMHASS energy plan dayahead_PV"
    sequence:
      - variables:
          costfun: profit
          maximum_power_from_grid: 15000
          maximum_power_to_grid: 5000
