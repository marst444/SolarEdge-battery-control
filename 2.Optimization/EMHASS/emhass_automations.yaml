# ── emhass_automations.yaml ──
# Layer 2: schedules ML fit/predict and MPC (15 min)/day-ahead (00:00) optimisation runs; tracks status and last-success time.
# Sets: input_text.emhass_mpc_status/emhass_dayahead_status, input_datetime.emhass_*_run/_last_success
# Deps: emhass_scripts.yaml  →  watchdog_sensors.yaml (sensor.emhass_health), battery_forecast_control.yaml
# Fixes: known_issues_and_fixes.md (2026-11-20: MPC/DH mutual-exclusion guard; continue_on_error so a failed run can't leave status stuck at RUNNING; ML fit/predict moved to :07 to avoid colliding with MPC; 2026-11-21: daily quick fit 05:52 + weekly full fit Sun 19:07)

# Machine-learning (ML) load forecast is generated by first running a "fit"
# and then a "predict".

automation:
  - id: EMHASS_ML_forecast_fit
    alias: "EMHASS ML forecast fit"
    description: "Automatically generate EMHASS machinelearning (ML) forecast fit"
    # Fix 2026-11-20: moved off :00 so the weekly fit doesn't collide with
    # the MPC run (shared EMHASS instance; MPC fires :00/:15/:30/:45).
    # 2026-11-21: added a daily quick fit (no backtest, ~1 s) at 05:52 so the
    # model includes the latest day and the 06:07 predict uses it. The weekly
    # Sunday 19:07 fit keeps the backtest (~50 s) for EMHASS's own metrics.
    trigger:
      - platform: time
        at: "05:52:00"
        id: daily_quick
      - platform: time
        at: "19:07:00"
        id: weekly_full
    condition:
      - condition: or
        conditions:
          - condition: trigger
            id: daily_quick
          - condition: and
            conditions:
              - condition: trigger
                id: weekly_full
              - condition: time
                weekday:
                  - sun
    action:
      - service: script.run_mlforecast_fit_load
        data:
          backtest: "{{ trigger.id == 'weekly_full' }}"
    mode: single

  - id: EMHASS_ML_forecast_predict
    alias: "EMHASS ML forecast predict"
    description: "Automatically generate EMHASS machinelearning (ML) forecast predict"
    # Fix 2026-11-20: minutes "7" added. Previously fired at hh:00:02, the
    # same second as the MPC run; since MPC was repaired (~06:15 2026-11-20)
    # every predict at 12:00/18:00 failed with an aiohttp "Client error"
    # (connection dropped), leaving sensor.p_load_forecast_ml_pv stale.
    trigger:
      - platform: time_pattern
        hours: "/6"
        minutes: "7"
      - platform: homeassistant
        event: start
    condition: []
    action:
  # Only delay when triggered by restart
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.platform == 'homeassistant' }}"
            sequence:
              # Fix 2026-11-20: 7 min (was 5) - MPC and DH also delay 5 min
              # after restart, so 5 min collided with them.
              - delay: "00:07:00"
      - service: script.run_mlforecast_predict_load
    mode: single

##############################
#
# EMHASS Energy plan created using a script based runtime payload input ad modum Siegen Energy
#
###############################

  - id: generate_EMHASS_energy_plan_mpc_pv
    alias: "Generate EMHASS energy plan mpc pv"
    description: "Automatically generate EMHASS energy plan for PV using MPC and ML"

    trigger:
      - platform: time_pattern
        minutes: "/15"
      - platform: homeassistant
        event: start

    condition: []
    action:
  # Only delay when triggered by restart
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.platform == 'homeassistant' }}"
            sequence:
              - delay: "00:05:00"
      # Fix 2026-11-20: skip this run if day-ahead is in progress (shared
      # EMHASS instance). Uses the script's `current` attribute rather than
      # input_text.emhass_dayahead_status, since that text can be left stuck
      # at RUNNING by a failed run. Placed after the restart delay so it
      # also catches the post-restart collision (both delay 5 min).
      - condition: template
        value_template: >
          {{ state_attr('script.generate_emhass_energy_plan_dh_pv', 'current') | int(0) == 0 }}
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.emhass_last_mpc_run
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.emhass_mpc_status
        data:
          value: "RUNNING"
      # Fix 2026-11-20: continue_on_error so a publish-data error falls
      # through to the FAILED branch instead of aborting and leaving
      # emhass_mpc_status stuck at RUNNING (seen 2026-11-20 21:00).
      - service: script.generate_emhass_energy_plan_mpc_pv
        continue_on_error: true
      # Fix 2026-11-19 (known_issues_and_fixes.md): the old check here was a
      # plain `condition: state` on sensor.mpc_pv_optim_status == "Optimal".
      # That sensor is ONLY ever written by this same (sometimes-failing)
      # publish-data REST call, so once it freezes on "Optimal" it stays
      # "Optimal" forever regardless of whether this run actually succeeded -
      # a tautological check that can never catch a failure once it's gone
      # stale. Added a recency requirement on the sensor's own last_updated.
      #
      # Fix 2026-11-20 (known_issues_and_fixes.md): that recency check used
      # `last_updated`, which turned out to be the wrong field for this
      # sensor and produced a near-100% false-positive rate. EMHASS posts
      # the literal, unchanging string "Optimal" (no varying attribute) on
      # every success, and Home Assistant treats a same-value/same-attribute
      # state write as a no-op - `last_updated`/`last_changed` never advance
      # on a repeat success, only on the first "Optimal" after some other
      # value. Confirmed live: EMHASS's own log showed "Successfully posted
      # ... = Optimal" (HTTP 200) on run after run, while this check still
      # read FAILED every single time, because last_updated stayed frozen on
      # whenever the value had last genuinely changed. `last_reported` is
      # the field Home Assistant actually advances on every write regardless
      # of whether the value changed - confirmed live via a direct template
      # read showing `last_reported` tracking each fresh successful post
      # while `last_updated` stayed stale. Swapped to `last_reported` below.
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.mpc_pv_optim_status') == 'Optimal'
                     and states.sensor.mpc_pv_optim_status is not none
                     and (now() - states.sensor.mpc_pv_optim_status.last_reported).total_seconds() < 120 }}
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: input_text.emhass_mpc_status
                data:
                  value: "OK"
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.emhass_mpc_last_success
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        default:
          - service: input_text.set_value
            target:
              entity_id: input_text.emhass_mpc_status
            data:
              value: "FAILED"
    mode: single




  - id: generate_EMHASS_energy_plan_dh_pv
    alias: "Generate EMHASS energy plan dh pv"
    description: "Automatically generate EMHASS energy plan for PV using DH and ML"

    trigger:
      - platform: time
        at: "00:00"
      - platform: homeassistant
        event: start

    condition: []
    action:
  # Only delay when triggered by restart
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.platform == 'homeassistant' }}"
            sequence:
              - delay: "00:05:00"
      # Fix 2026-11-20: wait for any in-flight MPC run to finish (shared
      # EMHASS instance; both trigger at 00:00 and both delay 5 min after
      # restart). Waits rather than skips - DH is once a day. Timeout 2 min
      # so a hung MPC can never block the daily plan.
      - wait_template: >
          {{ state_attr('script.generate_emhass_energy_plan_mpc_pv', 'current') | int(0) == 0 }}
        timeout: "00:02:00"
        continue_on_timeout: true
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.emhass_last_dayahead_run
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.emhass_dayahead_status
        data:
          value: "RUNNING"
      # Fix 2026-11-20: continue_on_error - same reason as the MPC automation.
      - service: script.generate_emhass_energy_plan_dh_pv
        continue_on_error: true
      # Fix 2026-11-19 (known_issues_and_fixes.md): same tautological-check
      # bug as generate_EMHASS_energy_plan_mpc_pv above, same fix - require
      # recency, not just value, since the status sensor is likewise only
      # written by the same publish-data call this check is supposed to be
      # verifying.
      #
      # Fix 2026-11-20 (known_issues_and_fixes.md): same last_updated ->
      # last_reported correction as the MPC automation above - see that
      # comment for the full mechanism (EMHASS posts an unchanging literal
      # "Optimal" on every success, which is a no-op for last_updated/
      # last_changed but still advances last_reported).
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.dh_pv_optim_status') == 'Optimal'
                     and states.sensor.dh_pv_optim_status is not none
                     and (now() - states.sensor.dh_pv_optim_status.last_reported).total_seconds() < 120 }}
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: input_text.emhass_dayahead_status
                data:
                  value: "OK"
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.emhass_dayahead_last_success
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        default:
          - service: input_text.set_value
            target:
              entity_id: input_text.emhass_dayahead_status
            data:
              value: "FAILED"
    mode: single