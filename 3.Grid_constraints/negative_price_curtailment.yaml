# ── negative_price_curtailment.yaml ──
# Layer 3: curtails grid export when export price goes negative; releases curtailment when price normalizes.
# Sets: input_boolean.negative_price_active, grid_export_blocked
# Deps: sensor.total_export_price, number.solaredge_i1_site_limit  →  gridconstrain_helpers.yaml
#
# Mechanism (redesigned 2026-10-06 - see known_issues_and_fixes.md, Negative
# Price Curtailment - Site Limit Restore Gap, and roadmap.md): the
# negative-site-limit switch (switch.solaredge_i1_negative_site_limit) is no
# longer toggled on/off per price change. It is expected to stay permanently
# ON; number.solaredge_i1_site_limit is now the sole thing that changes
# between curtailment (0 W) and normal/indifferent export (1,000,000 W, the
# number's own max - reproduces unconstrained export). This removes the
# switch-state restore-gap entirely: the number is written on every
# transition, lifetime, so there's nothing to "forget" to restore. The
# conditions below key off the number's current value (not the switch) to
# get the same compare-before-write guard the Modbus queue uses elsewhere,
# avoiding redundant writes on the 30s periodic trigger.
#
# The switch itself is asserted ON defensively inside the negative branch
# (self-healing, in case it's ever found off - e.g. after the one-time
# migration from the old design, or manual intervention) but is not part of
# the normal per-price-change write path any more.
# Fixes: known_issues_and_fixes.md

automation:
  - id: negative_price_curtailment
    alias: "Curtail Export When Price Negative"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.total_export_price
      - platform: time_pattern
        seconds: "/30"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.total_export_price') | float(0) < 0 }}
              - condition: template
                value_template: >
                  {{ states('number.solaredge_i1_site_limit') | float(-1) != 0 }}
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id:
                    - input_boolean.negative_price_active
                    - input_boolean.grid_export_blocked
              - if:
                  - condition: state
                    entity_id: switch.solaredge_i1_negative_site_limit
                    state: "off"
                then:
                  - service: script.turn_negative_site_limit_on_script
              - service: script.set_site_limit_curtailed_script
              - delay: "00:00:02"
              - service: script.maximize_self_consumption_script
              - delay: "00:00:02"
              - service: script.set_storage_discharge_limit0
          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.total_export_price') | float(0) >= 0 }}
              - condition: template
                value_template: >
                  {{ states('number.solaredge_i1_site_limit') | float(-1) != 1000000 }}
            sequence:
              - service: script.set_site_limit_normal_script
              - delay: "00:00:02"
              - service: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.negative_price_active
                    - input_boolean.grid_export_blocked