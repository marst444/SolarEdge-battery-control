# ── negative_price_curtailment.yaml ──
# Layer 3: curtails grid export when export price goes negative by varying number.solaredge_i1_site_limit (0=curtailed, 1000000=normal); releases curtailment when price normalizes. See architecture.md (Layer 3).
# Sets: input_boolean.negative_price_active, grid_export_blocked, number.solaredge_i1_site_limit
# Deps: sensor.total_export_price  →  gridconstrain_helpers.yaml, batterycontrol_scripts.yaml
# Fixes: known_issues_and_fixes.md (Negative Price Curtailment - Site Limit Restore Gap)

automation:
  - id: negative_price_curtailment
    alias: "Curtail Export When Price Negative"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.total_export_price
      - platform: time_pattern
        seconds: "/30"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.total_export_price') | float(0) < 0 }}
              - condition: template
                value_template: >
                  {{ states('number.solaredge_i1_site_limit') | float(-1) != 0 }}
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id:
                    - input_boolean.negative_price_active
                    - input_boolean.grid_export_blocked
              # defensive: re-assert the switch on if ever found off
              - if:
                  - condition: state
                    entity_id: switch.solaredge_i1_negative_site_limit
                    state: "off"
                then:
                  - service: script.turn_negative_site_limit_on_script
              - service: script.set_site_limit_curtailed_script
              - delay: "00:00:02"
              - service: script.maximize_self_consumption_script
              - delay: "00:00:02"
              - service: script.set_storage_discharge_limit0
          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.total_export_price') | float(0) >= 0 }}
              - condition: template
                value_template: >
                  {{ states('number.solaredge_i1_site_limit') | float(-1) != 1000000 }}
            sequence:
              - service: script.set_site_limit_normal_script
              - delay: "00:00:02"
              - service: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.negative_price_active
                    - input_boolean.grid_export_blocked