# ── solaredge_modbusqueue.yaml ──
# Layer 4C: serializes every SolarEdge Modbus write behind a single busy-lock so writes never overlap, with queue + write-outcome telemetry.
# Sets: input_boolean.modbus_busy; input_number/input_text.modbus_queue_*; select/number.solaredge_i1_* (via queue_service dispatch); writes into Layer 1 helpers in safety_and_watchdog_helpers.yaml (modbus_write_*, modbus_queue_pending_count, modbus_queue_last_command_delta)
# Deps: queue_service/queue_value from callers  ←  apply_effective_battery_control.yaml, negative_price_curtailment.yaml
# Fixes: known_issues_and_fixes.md (Modbus Queue Lock Release Not Exception-Safe, Negative Price Curtailment - Site Limit Restore Gap, Write-Outcome Telemetry Is Readback-Based); leftover debug logging - see roadmap.md

input_boolean:
  modbus_busy:
    name: Modbus Busy
    initial: off

input_number:

  modbus_queue_command_count_total:
    name: Modbus Queue Command Count (Total)
    initial: 0
    min: 0
    max: 999999999
    step: 1
    mode: box
    icon: mdi:counter

  modbus_queue_command_count_today:
    name: Modbus Queue Command Count (Today)
    initial: 0
    min: 0
    max: 999999
    step: 1
    mode: box
    icon: mdi:counter

  modbus_queue_timeout_count_total:
    name: Modbus Queue Timeout Count (Total)
    initial: 0
    min: 0
    max: 999999999
    step: 1
    mode: box
    icon: mdi:timer-alert

  modbus_queue_timeout_count_today:
    name: Modbus Queue Timeout Count (Today)
    initial: 0
    min: 0
    max: 999999
    step: 1
    mode: box
    icon: mdi:timer-alert

  modbus_queue_last_wait_seconds:
    name: Modbus Queue Last Wait Time
    initial: 0
    min: 0
    max: 60
    step: 0.01
    unit_of_measurement: s
    mode: box
    icon: mdi:timer-sand

  modbus_queue_last_execution_seconds:
    name: Modbus Queue Last Execution Time
    initial: 0
    min: 0
    max: 60
    step: 0.01
    unit_of_measurement: s
    mode: box
    icon: mdi:timer-outline

input_text:

  modbus_queue_last_queued_command:
    name: Modbus Queue Last Queued Command
    max: 255
    icon: mdi:tray-arrow-down

  modbus_queue_last_executed_command:
    name: Modbus Queue Last Executed Command
    max: 255
    icon: mdi:tray-arrow-up

script:
  modbus_queue:
    alias: Modbus Queue
    description: Handles queued Modbus commands to avoid communication errors
    fields:
      queue_service:
        description: "Service to call"
      queue_value:
        description: "Value to send"

    sequence:

      # Telemetry: stamp the moment this run was dispatched, and record it
      # as the last queued command before anything waits on the lock.
      # See roadmap.md - Add Queue Telemetry.
      - variables:
          command_received_at: "{{ now().timestamp() }}"

      - service: input_text.set_value
        target:
          entity_id: input_text.modbus_queue_last_queued_command
        data:
          value: "{{ queue_service }}={{ queue_value | default('') }} @ {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.modbus_queue_command_count_total
        data:
          value: "{{ (states('input_number.modbus_queue_command_count_total') | int(0)) + 1 }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.modbus_queue_command_count_today
        data:
          value: "{{ (states('input_number.modbus_queue_command_count_today') | int(0)) + 1 }}"

      # Enhanced Diagnostics: this run is now "pending" (queued or running)
      # until the lock is released near the end of this sequence. Since the
      # script runs in mode: queued, several runs can be stacked here at
      # once - this counter reflects that live depth.
      - service: input_number.set_value
        target:
          entity_id: input_number.modbus_queue_pending_count
        data:
          value: "{{ (states('input_number.modbus_queue_pending_count') | int(0)) + 1 }}"

      # Log incoming command
      - service: system_log.write
        data:
          message: "[{{ now() }}] Modbus Queue → Received command: {{ queue_service }}, Value: {{ queue_value | default(0) }}, Modbus Busy: {{ states('input_boolean.modbus_busy') }}"
          level: debug

      # DEBUG START
      - service: system_log.write
        data:
          message: >
            DEBUG START →
            queue_service="{{ queue_service }}",
            queue_value="{{ queue_value | default(0) }}",
            busy="{{ states('input_boolean.modbus_busy') }}"
          level: debug

      # Wait until Modbus is free
      - wait_template: "{{ not is_state('input_boolean.modbus_busy', 'on') }}"
        timeout: "00:00:10"
        continue_on_timeout: true

      # Telemetry: lock acquired (or the 10s wait ran out and we're pushing
      # through anyway, via continue_on_timeout) - record how long this run
      # waited, and bump the timeout counters if the wait never resolved on
      # its own (wait.completed == false means continue_on_timeout is what
      # let us through, not the lock actually clearing).
      - variables:
          lock_acquired_at: "{{ now().timestamp() }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.modbus_queue_last_wait_seconds
        data:
          value: "{{ (lock_acquired_at - command_received_at) | round(2) }}"

      - if:
          - condition: template
            value_template: "{{ wait.completed == false }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.modbus_queue_timeout_count_total
            data:
              value: "{{ (states('input_number.modbus_queue_timeout_count_total') | int(0)) + 1 }}"

          - service: input_number.set_value
            target:
              entity_id: input_number.modbus_queue_timeout_count_today
            data:
              value: "{{ (states('input_number.modbus_queue_timeout_count_today') | int(0)) + 1 }}"

      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.modbus_busy

      # DEBUG LOCK
      - service: system_log.write
        data:
          message: >
            DEBUG LOCK ACQUIRED →
            queue_service="{{ queue_service }}"
          level: debug

      # DEBUG BEFORE CHOOSE
      - service: system_log.write
        data:
          message: >
            DEBUG BEFORE CHOOSE →
            queue_service="{{ queue_service }}"
          level: debug

      # Enhanced Diagnostics: work out which entity this command is about to
      # write to and what value it should end up holding, BEFORE the choose:
      # dispatch runs, so we can (a) snapshot the pre-write value for the
      # command-delta sensor and (b) read the same entity back afterwards to
      # infer success/failure. This mirrors the queue_service matching logic
      # in the choose: block below one-for-one, in the same order, so it
      # classifies every branch (and the default: case) the same way the
      # dispatch itself does. See known_issues_and_fixes.md - Write-Outcome
      # Telemetry Is Readback-Based for the important caveat on what this
      # can and cannot detect.
      - variables:
          write_target_entity: >-
            {{ 'number.solaredge_i1_storage_command_timeout' if ('set_storage_command_timeout' in queue_service) else
               'select.solaredge_i1_storage_command_mode' if (
                 'charge_from_solar_power_and_grid' in queue_service or
                 'maximize_self_consumption' in queue_service or
                 'charge_from_clipped_solar_power' in queue_service or
                 'discharge_to_maximize_export' in queue_service or
                 'discharge_to_minimize_import' in queue_service or
                 'solar_power_only' in queue_service or
                 'charge_from_solar_power' in queue_service
               ) else
               'number.solaredge_i1_storage_charge_limit' if (
                 'set_storage_charge_limit' in queue_service or queue_service == 'set_dynamic_storage_charge_limit'
               ) else
               'number.solaredge_i1_storage_discharge_limit' if (
                 'set_storage_discharge_limit' in queue_service or 'set_dynamic_storage_discharge_limit' in queue_service
               ) else
               'number.solaredge_i1_site_limit' if (queue_service == 'set_site_limit') else
               'switch.solaredge_i1_negative_site_limit' if (queue_service in ['negative_site_limit_on', 'negative_site_limit_off']) else
               'none' }}
          write_expected_value: >-
            {{ (
                 'Charge from Solar Power and Grid' if ('charge_from_solar_power_and_grid' in queue_service) else
                 'Maximize Self Consumption' if ('maximize_self_consumption' in queue_service) else
                 'Charge from Clipped Solar Power' if ('charge_from_clipped_solar_power' in queue_service) else
                 'Discharge to Maximize Export' if ('discharge_to_maximize_export' in queue_service) else
                 'Discharge to Minimize Import' if ('discharge_to_minimize_import' in queue_service) else
                 'Solar Power Only (Off)' if ('solar_power_only' in queue_service) else
                 'Charge from Solar Power' if ('charge_from_solar_power' in queue_service) else
                 'unknown'
               ) if write_target_entity == 'select.solaredge_i1_storage_command_mode' else
               (
                 'on' if queue_service == 'negative_site_limit_on' else 'off'
               ) if write_target_entity == 'switch.solaredge_i1_negative_site_limit' else
               (queue_value | default('') | string) }}
          write_before_value: "{{ states(write_target_entity) }}"

      # CHOOSE BLOCK
      # continue_on_error: if the dispatched SolarEdge service call raises
      # (e.g. a Modbus write failure), the error is logged by HA and this
      # step ends, but the sequence continues to the pacing delay and lock
      # release below instead of aborting - the lock is no longer left
      # stuck "on" for the next queued command's 10s wait_template to force
      # through. See known_issues_and_fixes.md - Modbus Queue Lock Release
      # Not Exception-Safe.
      - choose:

          - conditions:
              - condition: template
                value_template: "{{ 'set_storage_command_timeout' in queue_service }}"
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.solaredge_i1_storage_command_timeout
                data:
                  value: "{{ queue_value | int }}"
# Charge from solar power and grid
          - conditions:
              - condition: template
                value_template: "{{ 'charge_from_solar_power_and_grid' in queue_service }}"
            sequence:
              - service: system_log.write
                data:
                  message: "[{{ now() }}] Modbus Queue → SET MODE = Charge from Solar Power and Grid"
                  level: debug
              - service: select.select_option
                target:
                  entity_id: select.solaredge_i1_storage_command_mode
                data:
                  option: Charge from Solar Power and Grid
# Maxmize self consumption
          - conditions:
              - condition: template
                value_template: "{{ 'maximize_self_consumption' in queue_service }}"
            sequence:
              - service: system_log.write
                data:
                  message: "[{{ now() }}] Modbus Queue → SET MODE = Maximize Self Consumption"
                  level: debug
              - service: select.select_option
                target:
                  entity_id: select.solaredge_i1_storage_command_mode
                data:
                  option: Maximize Self Consumption
# Charge from solar power
          - conditions:
              - condition: template
                value_template: "{{ 'charge_from_solar_power' in queue_service }}"
            sequence:
              - service: select.select_option
                target:
                  entity_id: select.solaredge_i1_storage_command_mode
                data:
                  option: Charge from Solar Power
# Charge from clipped colar power
          - conditions:
              - condition: template
                value_template: "{{ 'charge_from_clipped_solar_power' in queue_service }}"
            sequence:
              - service: select.select_option
                target:
                  entity_id: select.solaredge_i1_storage_command_mode
                data:
                  option: Charge from Clipped Solar Power
# discharge to maximize export
          - conditions:
              - condition: template
                value_template: "{{ 'discharge_to_maximize_export' in queue_service }}"
            sequence:
              - service: select.select_option
                target:
                  entity_id: select.solaredge_i1_storage_command_mode
                data:
                  option: Discharge to Maximize Export
# Discharge to minimize import
          - conditions:
              - condition: template
                value_template: "{{ 'discharge_to_minimize_import' in queue_service }}"
            sequence:
              - service: select.select_option
                target:
                  entity_id: select.solaredge_i1_storage_command_mode
                data:
                  option: Discharge to Minimize Import
# solar power only
          - conditions:
              - condition: template
                value_template: "{{ 'solar_power_only' in queue_service }}"
            sequence:
              - service: select.select_option
                target:
                  entity_id: select.solaredge_i1_storage_command_mode
                data:
                  option: Solar Power Only (Off)

# charge limit
          - conditions:
              - condition: template
                value_template: "{{ 'set_storage_charge_limit' in queue_service }}"
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.solaredge_i1_storage_charge_limit
                data:
                  value: "{{ queue_value | int }}"

# discharge limit
          - conditions:
              - condition: template
                value_template: "{{ 'set_storage_discharge_limit' in queue_service }}"
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.solaredge_i1_storage_discharge_limit
                data:
                  value: "{{ queue_value | int }}"

# dynamic discharge limit
          - conditions:
              - condition: template
                value_template: "{{ 'set_dynamic_storage_discharge_limit' in queue_service }}"
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.solaredge_i1_storage_discharge_limit
                data:
                  value: "{{ queue_value | float }}"

# dynamic charge limit
          - conditions:
              - condition: template
                value_template: "{{ queue_service == 'set_dynamic_storage_charge_limit' }}"
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.solaredge_i1_storage_charge_limit
                data:
                  value: "{{ queue_value | float }}"

# site limit value - 0 curtails export, 1000000 (number's own max) restores
# normal export. See known_issues_and_fixes.md (Negative Price Curtailment
# - Site Limit Restore Gap).
          - conditions:
              - condition: template
                value_template: "{{ queue_service == 'set_site_limit' }}"
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.solaredge_i1_site_limit
                data:
                  value: "{{ queue_value | int }}"

# negative site limit switch - defensive/manual use only, not part of the
# normal write path. See known_issues_and_fixes.md (Negative Price
# Curtailment - Site Limit Restore Gap).
          - conditions:
              - condition: template
                value_template: "{{ queue_service == 'negative_site_limit_on' }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.solaredge_i1_negative_site_limit

          - conditions:
              - condition: template
                value_template: "{{ queue_service == 'negative_site_limit_off' }}"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.solaredge_i1_negative_site_limit

        default:
          - service: system_log.write
            data:
              message: >
                ❌ DEBUG ERROR →
                No matching queue_service="{{ queue_service }}"
              level: error

        continue_on_error: true

      # Post-command pacing delay: runs whether the command above succeeded
      # or errored (continue_on_error), so a Modbus write failure is paced
      # the same ~2s as a normal successful write instead of either being
      # released instantly (which could let a queued backlog of up to 10
      # commands drain back-to-back against a still-struggling connection)
      # or left stuck relying on the next caller's 10s wait_template. See
      # known_issues_and_fixes.md - Modbus Queue Lock Release Not
      # Exception-Safe.
      - delay: "00:00:02"

      # Enhanced Diagnostics: classify this run as success/failure by
      # reading write_target_entity back now and comparing it to
      # write_expected_value - see the caveat noted where those variables
      # were set above (known_issues_and_fixes.md - Write-Outcome Telemetry
      # Is Readback-Based). write_outcome is 'unmatched_service' when the
      # queue_service never matched a branch above (same condition the
      # choose: block's own default: hit), otherwise 'success'/'failure'.
      - variables:
          write_success: >-
            {{ (states(write_target_entity) == write_expected_value)
                 if (write_target_entity.split('.')[0] in ['select', 'switch'])
               else
                 (((states(write_target_entity) | float(-999999999)) - (write_expected_value | float(-999999998))) | abs < 1) }}
          write_outcome: >-
            {{ 'unmatched_service' if write_target_entity == 'none' else ('success' if write_success else 'failure') }}

      - if:
          - condition: template
            value_template: "{{ write_outcome == 'success' }}"
        then:
          - service: input_text.set_value
            target:
              entity_id: input_text.modbus_last_successful_write
            data:
              value: "{{ queue_service }}={{ queue_value | default('') }} @ {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

          - service: input_number.set_value
            target:
              entity_id: input_number.modbus_write_success_count_total
            data:
              value: "{{ (states('input_number.modbus_write_success_count_total') | int(0)) + 1 }}"

          - service: input_number.set_value
            target:
              entity_id: input_number.modbus_write_success_count_today
            data:
              value: "{{ (states('input_number.modbus_write_success_count_today') | int(0)) + 1 }}"

          - service: input_number.set_value
            target:
              entity_id: input_number.modbus_write_consecutive_failures
            data:
              value: 0

          # Command delta only means something for the numeric branches
          # (write_target_entity domain "number") - mode selects and the
          # negative-site-limit switch have no meaningful numeric delta.
          - if:
              - condition: template
                value_template: "{{ write_target_entity.split('.')[0] == 'number' }}"
            then:
              - service: input_number.set_value
                target:
                  entity_id: input_number.modbus_queue_last_command_delta
                data:
                  value: >-
                    {{ ((write_expected_value | float(0)) - (write_before_value | float(0))) | round(2) }}
        else:
          - service: input_text.set_value
            target:
              entity_id: input_text.modbus_last_failed_write
            data:
              value: "{{ queue_service }}={{ queue_value | default('') }} @ {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

          - service: input_text.set_value
            target:
              entity_id: input_text.modbus_last_failed_reason
            data:
              value: >-
                {{ 'No matching queue_service' if write_outcome == 'unmatched_service' else
                   ('Entity ' + write_target_entity + ' expected ' + (write_expected_value | string) + ' but reads ' + states(write_target_entity)) }}

          - service: input_number.set_value
            target:
              entity_id: input_number.modbus_write_failure_count_total
            data:
              value: "{{ (states('input_number.modbus_write_failure_count_total') | int(0)) + 1 }}"

          - service: input_number.set_value
            target:
              entity_id: input_number.modbus_write_failure_count_today
            data:
              value: "{{ (states('input_number.modbus_write_failure_count_today') | int(0)) + 1 }}"

          - service: input_number.set_value
            target:
              entity_id: input_number.modbus_write_consecutive_failures
            data:
              value: "{{ (states('input_number.modbus_write_consecutive_failures') | int(0)) + 1 }}"

      # DEBUG END
      - service: system_log.write
        data:
          message: >
            DEBUG END →
            queue_service="{{ queue_service }}"
          level: debug

      # Telemetry: execution time covers lock-acquired → here (the choose:
      # dispatch above plus the 2s pacing delay), and "last executed" is
      # stamped just before the lock releases, so it means fully processed
      # rather than merely dispatched.
      - service: input_number.set_value
        target:
          entity_id: input_number.modbus_queue_last_execution_seconds
        data:
          value: "{{ (now().timestamp() - lock_acquired_at) | round(2) }}"

      - service: input_text.set_value
        target:
          entity_id: input_text.modbus_queue_last_executed_command
        data:
          value: "{{ queue_service }}={{ queue_value | default('') }} @ {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

      # Enhanced Diagnostics: this run is no longer pending, success or
      # failure - decrement before releasing the lock. Floored at 0 so a
      # stray double-decrement (e.g. after an HA restart mid-run) can't
      # drive it negative.
      - service: input_number.set_value
        target:
          entity_id: input_number.modbus_queue_pending_count
        data:
          value: "{{ max((states('input_number.modbus_queue_pending_count') | int(0)) - 1, 0) }}"

      # Release Modbus lock - now unconditionally reached, success or error
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.modbus_busy

      - service: system_log.write
        data:
          message: "[{{ now() }}] Modbus Queue → Lock released, command {{ queue_service }} completed"
          level: debug

    mode: queued
    max: 10

automation:

  - id: reset_modbus_queue_daily_counters
    alias: "Reset Modbus Queue Daily Telemetry Counters"
    description: "Zeroes the Today command/timeout counters at midnight. The Total counters are lifetime and are never touched here."
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.modbus_queue_command_count_today
        data:
          value: 0

      - service: input_number.set_value
        target:
          entity_id: input_number.modbus_queue_timeout_count_today
        data:
          value: 0