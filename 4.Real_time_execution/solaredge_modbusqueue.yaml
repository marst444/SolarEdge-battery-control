###############################################################################
# Layer 4C Modbus Queue: serializes all SolarEdge writes. Mode list and
# semantics: README.md - Storage Control Modes Explained.
###############################################################################

input_boolean:
  modbus_busy:
    name: Modbus Busy
    initial: off

script:
  modbus_queue:
    alias: Modbus Queue
    description: Handles queued Modbus commands to avoid communication errors
    fields:
      queue_service:
        description: "Service to call"
      queue_value:
        description: "Value to send"

    sequence:

      # Log incoming command
      - service: system_log.write
        data:
          message: "[{{ now() }}] Modbus Queue → Received command: {{ queue_service }}, Value: {{ queue_value | default(0) }}, Modbus Busy: {{ states('input_boolean.modbus_busy') }}"
          level: debug

      # DEBUG START
      - service: system_log.write
        data:
          message: >
            DEBUG START →
            queue_service="{{ queue_service }}",
            queue_value="{{ queue_value | default(0) }}",
            busy="{{ states('input_boolean.modbus_busy') }}"
          level: debug

      # Wait until Modbus is free
      - wait_template: "{{ not is_state('input_boolean.modbus_busy', 'on') }}"
        timeout: "00:00:10"
        continue_on_timeout: true

      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.modbus_busy

      # DEBUG LOCK
      - service: system_log.write
        data:
          message: >
            DEBUG LOCK ACQUIRED →
            queue_service="{{ queue_service }}"
          level: debug

      # DEBUG BEFORE CHOOSE
      - service: system_log.write
        data:
          message: >
            DEBUG BEFORE CHOOSE →
            queue_service="{{ queue_service }}"
          level: debug

      # CHOOSE BLOCK
      # continue_on_error: if the dispatched SolarEdge service call raises
      # (e.g. a Modbus write failure), the error is logged by HA and this
      # step ends, but the sequence continues to the pacing delay and lock
      # release below instead of aborting - the lock is no longer left
      # stuck "on" for the next queued command's 10s wait_template to force
      # through. See known_issues_and_fixes.md - Modbus Queue Lock Release
      # Not Exception-Safe.
      - choose:

          - conditions:
              - condition: template
                value_template: "{{ 'set_storage_command_timeout' in queue_service }}"
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.solaredge_i1_storage_command_timeout
                data:
                  value: "{{ queue_value | int }}"
# Charge from solar power and grid
          - conditions:
              - condition: template
                value_template: "{{ 'charge_from_solar_power_and_grid' in queue_service }}"
            sequence:
              - service: system_log.write
                data:
                  message: "[{{ now() }}] Modbus Queue → SET MODE = Charge from Solar Power and Grid"
                  level: debug
              - service: select.select_option
                target:
                  entity_id: select.solaredge_i1_storage_command_mode
                data:
                  option: Charge from Solar Power and Grid
# Maxmize self consumption
          - conditions:
              - condition: template
                value_template: "{{ 'maximize_self_consumption' in queue_service }}"
            sequence:
              - service: system_log.write
                data:
                  message: "[{{ now() }}] Modbus Queue → SET MODE = Maximize Self Consumption"
                  level: debug
              - service: select.select_option
                target:
                  entity_id: select.solaredge_i1_storage_command_mode
                data:
                  option: Maximize Self Consumption
# Charge from solar power
          - conditions:
              - condition: template
                value_template: "{{ 'charge_from_solar_power' in queue_service }}"
            sequence:
              - service: select.select_option
                target:
                  entity_id: select.solaredge_i1_storage_command_mode
                data:
                  option: Charge from Solar Power
# Charge from clipped colar power
          - conditions:
              - condition: template
                value_template: "{{ 'charge_from_clipped_solar_power' in queue_service }}"
            sequence:
              - service: select.select_option
                target:
                  entity_id: select.solaredge_i1_storage_command_mode
                data:
                  option: Charge from Clipped Solar Power
# discharge to maximize export
          - conditions:
              - condition: template
                value_template: "{{ 'discharge_to_maximize_export' in queue_service }}"
            sequence:
              - service: select.select_option
                target:
                  entity_id: select.solaredge_i1_storage_command_mode
                data:
                  option: Discharge to Maximize Export
# Discharge to minimize import
          - conditions:
              - condition: template
                value_template: "{{ 'discharge_to_minimize_import' in queue_service }}"
            sequence:
              - service: select.select_option
                target:
                  entity_id: select.solaredge_i1_storage_command_mode
                data:
                  option: Discharge to Minimize Import
# solar power only
          - conditions:
              - condition: template
                value_template: "{{ 'solar_power_only' in queue_service }}"
            sequence:
              - service: select.select_option
                target:
                  entity_id: select.solaredge_i1_storage_command_mode
                data:
                  option: Solar Power Only (Off)

# charge limit
          - conditions:
              - condition: template
                value_template: "{{ 'set_storage_charge_limit' in queue_service }}"
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.solaredge_i1_storage_charge_limit
                data:
                  value: "{{ queue_value | int }}"

# discharge limit
          - conditions:
              - condition: template
                value_template: "{{ 'set_storage_discharge_limit' in queue_service }}"
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.solaredge_i1_storage_discharge_limit
                data:
                  value: "{{ queue_value | int }}"

# dynamic discharge limit
          - conditions:
              - condition: template
                value_template: "{{ 'set_dynamic_storage_discharge_limit' in queue_service }}"
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.solaredge_i1_storage_discharge_limit
                data:
                  value: "{{ queue_value | float }}"

# dynamic charge limit
          - conditions:
              - condition: template
                value_template: "{{ queue_service == 'set_dynamic_storage_charge_limit' }}"
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.solaredge_i1_storage_charge_limit
                data:
                  value: "{{ queue_value | float }}"

# export curtailment/site limit when neg. prices ON
          - conditions:
              - condition: template
                value_template: "{{ queue_service == 'negative_site_limit_on' }}"
            sequence:
            # Ensure site limit value is 0 before activating negative site limit.
            # This inner delay sequences two writes within the SAME command
            # (site limit, then the switch) - it is not the trailing pacing
            # delay and is kept as-is.
              - if:
                - condition: template
                  value_template: >-
                    {{ states('number.solaredge_i1_site_limit') | float(999) != 0 }}
                then:
                  - service: number.set_value
                    target:
                      entity_id: number.solaredge_i1_site_limit
                    data:
                      value: 0
                  - delay: "00:00:02"

            # Activate negative site limit switch
              - service: switch.turn_on
                target:
                  entity_id: switch.solaredge_i1_negative_site_limit

          - conditions:
              - condition: template
                value_template: "{{ queue_service == 'negative_site_limit_off' }}"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.solaredge_i1_negative_site_limit

        default:
          - service: system_log.write
            data:
              message: >
                ❌ DEBUG ERROR →
                No matching queue_service="{{ queue_service }}"
              level: error

        continue_on_error: true

      # Post-command pacing delay: runs whether the command above succeeded
      # or errored (continue_on_error), so a Modbus write failure is paced
      # the same ~2s as a normal successful write instead of either being
      # released instantly (which could let a queued backlog of up to 10
      # commands drain back-to-back against a still-struggling connection)
      # or left stuck relying on the next caller's 10s wait_template. See
      # known_issues_and_fixes.md - Modbus Queue Lock Release Not
      # Exception-Safe.
      - delay: "00:00:02"

      # DEBUG END
      - service: system_log.write
        data:
          message: >
            DEBUG END →
            queue_service="{{ queue_service }}"
          level: debug

      # Release Modbus lock - now unconditionally reached, success or error
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.modbus_busy

      - service: system_log.write
        data:
          message: "[{{ now() }}] Modbus Queue → Lock released, command {{ queue_service }} completed"
          level: debug

    mode: queued
    max: 10