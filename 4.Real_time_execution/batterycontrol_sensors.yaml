# ── batterycontrol_sensors.yaml ──
# Layer 4A: battery value/worth-it sensors, dynamic charge/discharge limit calc, smoothed SOC target, Mode Command Guard, PV/load smoothing.
# Sets: sensor.battery_value, dynamic_storage_*_limit, soc_batt_forecast_smooth, battery_mode_command_guard, pv/house_load_smoothed
# Deps: sensor.solaredge_b1_state_of_energy, sensor.mpc_pv_batt_soc  →  battery_forecast_control.yaml, batterycontrol_automations.yaml
# Fixes: known_issues_and_fixes.md

template:
  - sensor:
      # Current value of energy stored in battery (cost already paid)
      - name: "Battery Value"
        unique_id: battery_value
        unit_of_measurement: "SEK"
        state: >
          {% set soc = states('sensor.solaredge_b1_state_of_energy') | float(0) / 100 %}
          {% set capacity = 4.6 %}
          {% set avg_price_paid = states('input_number.average_last_chargingprice') | float(0) %}
          {{ (soc * capacity * avg_price_paid) | round(2) }}

      # Worth using battery for house load
      - name: "Use Battery for House Load Worth It"
        unique_id: use_battery_for_house_load_worth_it
        state: >
          {% set battery_value = states('sensor.battery_value') | float(0) %}
          {% set soc = states('sensor.solaredge_b1_state_of_energy') | float(0) / 100 %}
          {% set capacity = 4.6 %}
          {% set current_import_price = states('sensor.total_import_price') | float(0) %}
          {% set potential_saving = soc * capacity * current_import_price %}
          {{ potential_saving > battery_value }}

      # Worth exporting battery to grid
      - name: "Battery Worth Exporting"
        unique_id: battery_worth_exporting
        state: >
          {% set battery_value = states('sensor.battery_value') | float(0) %}
          {% set soc = states('sensor.solaredge_b1_state_of_energy') | float(0) / 100 %}
          {% set capacity = 4.6 %}
          {% set current_export_price = states('sensor.total_export_price') | float(0) %}
          {% set potential_revenue = soc * capacity * current_export_price %}
          {{ potential_revenue > battery_value }}

      # === Dynamic Storage Charge Limit ===
      - name: "Dynamic Storage Charge Limit"
        unique_id: dynamic_storage_charge_limit
        unit_of_measurement: "W"
        state: >
          {% set soc_now = states('sensor.solaredge_b1_state_of_energy') | float(0) %}
          {% set forecast_raw = state_attr('sensor.mpc_pv_batt_soc', 'battery_scheduled_soc') or [] %}
          {% set batt_capacity_wh = 4600 %}
          {% set now_ts = as_timestamp(now()) %}
          {% if forecast_raw | length >= 1 %}
            {% set first_ts = as_timestamp(forecast_raw[0].date) %}
            {% if first_ts < now_ts %}
              {% set forecast = forecast_raw[1:] %}
            {% else %}
              {% set forecast = forecast_raw %}
            {% endif %}
          {% else %}
            {% set forecast = [] %}
          {% endif %}
          {% if forecast | length >= 1 %}
            {% set raw_next = forecast[0].mpc_pv_batt_soc | float(0) %}
            {% set soc_min = states('input_number.minimum_state_of_charge') | float(20) %}
            {% set soc_max = states('input_number.maximum_state_of_charge') | float(90) %}
            {% set next_forecast = [[raw_next, soc_min] | max, soc_max] | min %}
            {% set power = ((next_forecast - soc_now) / 100 * batt_capacity_wh) | round(0) %}
            {{ power if power > 0 else 0 }}
          {% else %}
            {{ states('input_number.last_charge_limit') | float(3300) }}
          {% endif %}

      # === Dynamic Storage Discharge Limit ===
      - name: "Dynamic Storage Discharge Limit"
        unit_of_measurement: "W"
        unique_id: dynamic_storage_discharge_limit
        state: >
          {% set soc_now = states('sensor.solaredge_b1_state_of_energy') | float(0) %}
          {% set forecast_raw = state_attr('sensor.mpc_pv_batt_soc', 'battery_scheduled_soc') or [] %}
          {% set batt_capacity_wh = 4600 %}
          {% set now_ts = as_timestamp(now()) %}
          {% if forecast_raw | length >= 1 %}
            {% set first_ts = as_timestamp(forecast_raw[0].date) %}
            {% if first_ts < now_ts %}
              {% set forecast = forecast_raw[1:] %}
            {% else %}
              {% set forecast = forecast_raw %}
            {% endif %}
          {% else %}
            {% set forecast = [] %}
          {% endif %}
          {% if forecast | length >= 1 %}
            {% set raw_next = forecast[0].mpc_pv_batt_soc | float(0) %}
            {% set soc_min = states('input_number.minimum_state_of_charge') | float(20) %}
            {% set soc_max = states('input_number.maximum_state_of_charge') | float(90) %}
            {% set next_forecast = [[raw_next, soc_min] | max, soc_max] | min %}
            {% set power = ((next_forecast - soc_now) / 100 * batt_capacity_wh) | round(0) %}
            {{ (-power) if power < 0 else 0 }}
          {% else %}
            {{ states('input_number.last_discharge_limit') | float(3300) }}
          {% endif %}

      # === Smoothed SOC Forecast ===
      - name: "SOC Batt Forecast Smooth"
        unique_id: soc_batt_forecast_smooth
        unit_of_measurement: "%"
        state: >
          {% set forecast_raw = state_attr('sensor.mpc_pv_batt_soc', 'battery_scheduled_soc') or [] %}
          {% set now_ts = as_timestamp(now()) %}
          {# Keep only future entries #}
          {% set forecast = forecast_raw | selectattr('date', 'defined') | list %}
          {% set forecast_future = forecast | selectattr('date', '>=', now() | string) | list %}

          {% set soc_min = states('input_number.minimum_state_of_charge') | float(20) %}
          {% set soc_max = states('input_number.maximum_state_of_charge') | float(90) %}

          {% if forecast_future | length >= 3 %}
            {% set s1 = forecast_future[0].mpc_pv_batt_soc | float %}
            {% set s2 = forecast_future[1].mpc_pv_batt_soc | float %}
            {% set s3 = forecast_future[2].mpc_pv_batt_soc | float %}
            {% set raw = (s1*0.5 + s2*0.3 + s3*0.2) | round(2) %}
          {% elif forecast_future | length >= 1 %}
            {% set raw = forecast_future[0].mpc_pv_batt_soc | float %}
          {% else %}
            {% set raw = states('input_number.soc_target') | float(30) %}
          {% endif %}

          {{ [[raw, soc_min] | max, soc_max] | min | round(2) }}

      # === Mode Command Guard status ===
      # Diagnostic mirroring the Layer 4B guard condition in
      # apply_effective_battery_control.yaml. "guarded" = the mode-select
      # command + timeout reset would currently be skipped (effective mode,
      # live inverter mode, and inverter's configured default mode all
      # confirm Maximize Self Consumption); "active" = the full command
      # sequence is/would be sent. See architecture.md - Layer 4B - Mode
      # Command Guard.
      - name: "Battery Mode Command Guard"
        unique_id: battery_mode_command_guard
        icon: mdi:shield-check
        state: >
          {% set effective_mode = states('input_select.effective_storage_mode') %}
          {% set inverter_mode = states('select.solaredge_i1_storage_command_mode') %}
          {% set default_mode = states('select.solaredge_i1_storage_default_mode') %}
          {% if effective_mode == 'maximize_self_consumption'
                and inverter_mode == 'Maximize Self Consumption'
                and default_mode == 'Maximize Self Consumption' %}
            guarded
          {% else %}
            active
          {% endif %}

###############################################################################
# PV / House Load Smoothing (Layer 4A input smoothing)
#
# 4-minute trailing means of PV production and house load, read by
# battery_forecast_control.yaml's mode-selecting comparisons instead of the
# raw instantaneous sensors, so a momentary spike/dip at the 15-min trigger
# instant can't flip the requested mode. Window size and rationale:
# architecture.md - Layer 4A - PV/Load Sampling Smoothing. The raw sensors
# (sensor.solar_panel_production_w, sensor.power_myhouse_load_no_var_loads)
# are unaffected and still used directly elsewhere (dashboards, other
# automations, and Maintain Zone's charge-ceiling choice).
###############################################################################

sensor:
  - platform: statistics
    name: "PV Production Smoothed"
    unique_id: pv_production_smoothed
    entity_id: sensor.solar_panel_production_w
    state_characteristic: mean
    max_age:
      minutes: 4
    precision: 0

  - platform: statistics
    name: "House Load Smoothed"
    unique_id: house_load_smoothed
    entity_id: sensor.power_myhouse_load_no_var_loads
    state_characteristic: mean
    max_age:
      minutes: 4
    precision: 0