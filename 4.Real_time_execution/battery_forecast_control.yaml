# ── battery_forecast_control.yaml ──
# Layer 4A: converts EMHASS forecast + live SOC/PV/load into requested battery mode/limits every 15 min. See architecture.md (Layer 4A).
# Sets: input_select.emhass_requested_storage_mode, input_number.emhass_requested_charge/discharge_limit
# Deps: sensor.mpc_pv_batt/grid_power, sensor.emhass_health, sensor.solaredge_b1_state_of_energy  →  safety_limits_and_override.yaml
# Fixes: known_issues_and_fixes.md (EMHASS Outage Fallback Guard, SOC-Unavailable Guard, PV Noise Floor 2026-11-02, Update 2026-11-03 - Solar Power Only Replaced With Discharge to Maximize Export in the Maintain Zone fallback); unused `ev` var - see roadmap.md

automation:

  - id: emhass_battery_forecast_control
    alias: "EMHASS Forecast Driven Battery Control"
    trigger:
      - platform: time_pattern
        minutes: "/15"
        seconds: 0
    condition:
      - condition: state
        entity_id: select.solaredge_i1_storage_control_mode
        state: "Remote Control"
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.solaredge_b1_state_of_energy
            state:
              - "unavailable"
              - "unknown"
      # EMHASS health guard: skips the whole run whenever sensor.emhass_health
      # reads "MPC stalled"/"MPC problem", so a stale/missing EMHASS forecast
      # isn't misread via | float(0) as a real neutral plan. RUNNING is still
      # allowed through (previous successful forecast is still valid mid-run).
      # See known_issues_and_fixes.md - EMHASS Outage Fallback Guard.
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.emhass_health
            state:
              - "MPC stalled"
              - "MPC problem"
    action:
      - variables:
          soc: "{{ (states('sensor.solaredge_b1_state_of_energy') | float(0)) }}"
          soc_max: "{{ (states('input_number.maximum_state_of_charge') | float(90)) }}"
          soc_min: "{{ (states('input_number.minimum_state_of_charge') | float(20)) }}"
          target: "{{ states('sensor.soc_batt_forecast_smooth') | float(30) }}"
          db: "{{ (states('input_number.soc_deadband') | float(0)) }}"
          below: "{{ soc < (target - db) }}"
          above: "{{ soc > (target + db) }}"
          maintain: "{{ soc >= (target - db) and soc <= (target + db) }}"
          # PV/Load Smoothing: 4-minute trailing means (batterycontrol_
          # sensors.yaml) used for every comparison that selects between
          # distinct storage MODES, to avoid a momentary spike/dip at this
          # 15-min trigger instant flipping the requested mode. A noise
          # floor (input_number.pv_noise_floor_w, default 20W) is applied
          # on top: several branches below test `pv == 0` exactly to mean
          # "no real PV" - a small sensor offset/trickle reading breaks
          # that exact-equality test and can fall through into the
          # pv>0 branches (real grid-charging logic) at night. Flooring pv
          # to 0 below the threshold restores that intent. See
          # known_issues_and_fixes.md - PV Sensor Trickle Readings Bypass
          # the "No PV" Branch Logic, and architecture.md - Layer 4A - PV/
          # Load Sampling Smoothing.
          pv: >-
            {% set raw = states('sensor.pv_production_smoothed') | float(0) %}
            {{ 0 if raw < (states('input_number.pv_noise_floor_w') | float(20)) else raw }}
          house_load: "{{ (states('sensor.house_load_smoothed') | float(0)) }}"

          # Instantaneous (unsmoothed): used only in Maintain Zone to pick a
          # charge-limit ceiling within the same mode (no mode-flapping
          # risk), so it reacts to the current tick instead of a 4-minute
          # lagged mean. Same noise floor applied, for the same reason.
          # See architecture.md - Layer 4A - PV/Load Sampling Smoothing.
          pv_now: >-
            {% set raw_now = states('sensor.solar_panel_production_w') | float(0) %}
            {{ 0 if raw_now < (states('input_number.pv_noise_floor_w') | float(20)) else raw_now }}
          house_load_now: "{{ (states('sensor.power_myhouse_load_no_var_loads') | float(0)) }}"

          ac_lim: "{{ (states('input_number.ac_maxpower') | float(0)) }}"
          batt_fc: "{{ (states('sensor.mpc_pv_batt_power') | float(0)) }}"
          grid_fc: "{{ (states('sensor.mpc_pv_grid_power') | float(0)) }}"
          ev: "{{ (states('binary_sensor.ev_charging_active')) }}"

          price_import: "{{ (states('sensor.total_import_price') | float(0)) }}"
          last_average_chargingprice: "{{ (states('input_number.average_last_chargingprice') | float(0) * 1.2) }}"

          cooldown_elapsed: >-
            {{ (as_timestamp(now()) - as_timestamp(states('input_datetime.last_grid_charge_command_time'), 0))
               >= (states('input_number.grid_charge_export_cooldown_minutes') | float(60) * 60) }}

      - choose:

          # ===== CLIPPED SOLAR =====
          - conditions:
              - condition: template
                value_template: "{{ pv > ac_lim }}"
              - condition: template
                value_template: "{{ soc < soc_max }}"
            sequence:
             # Shadow/requested state
              - service: input_select.select_option
                target:
                  entity_id: input_select.emhass_requested_storage_mode
                data:
                  option: "charge_from_clipped_solar"

              - service: input_number.set_value
                target:
                  entity_id: input_number.emhass_requested_charge_limit
                data:
                  value: "{{ states('input_number.dynamic_charge_limit') | float(0) }}"

              - service: input_number.set_value
                target:
                  entity_id: input_number.emhass_requested_discharge_limit
                data:
                  value: "{{ states('input_number.dynamic_discharge_limit') | float(0) }}"


          # ===== BELOW-SOC / Charging logic =====
          - conditions:
              - condition: template
                value_template: "{{ below and (soc < soc_max) }}"
            sequence:
              - choose:

                  # Below and PV > house load AND grid_forecast >=0 (no export/import): maximize self-consumption
                  - conditions:
                      - condition: template
                        value_template: "{{ (pv > house_load) and (grid_fc >=0) }}"
                    sequence:
            # Shadow/requested state
                      - service: input_select.select_option
                        target:
                          entity_id: input_select.emhass_requested_storage_mode
                        data:
                          option: "maximize_self_consumption"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_charge_limit
                        data:
                          value: "{{ states('input_number.dynamic_charge_limit') | float(0) }}"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_discharge_limit
                        data:
                          value: "{{ states('input_number.dynamic_discharge_limit') | float(0) }}"


                  # Below and PV > house load AND grid forecast <0 (export): set discharglimit to 0
                  - conditions:
                      - condition: template
                        value_template: "{{ (pv > house_load) and (grid_fc <0) }}"
                    sequence:
            # Shadow/requested state
                      - service: input_select.select_option
                        target:
                          entity_id: input_select.emhass_requested_storage_mode
                        data:
                          option: "discharge_to_maximize_export"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_charge_limit
                        data:
                          value: "{{ states('input_number.dynamic_charge_limit') | float(0) }}"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_discharge_limit
                        data:
                          value: 0


                  # Below and PV <= load and BattForecast is charging: charge from solar+grid
                  - conditions:
                      - condition: template
                        value_template: "{{ (pv <= house_load) and (pv > 0) and (batt_fc <0) }}"
                    sequence:
            # Shadow/requested state
                      - service: input_select.select_option
                        target:
                          entity_id: input_select.emhass_requested_storage_mode
                        data:
                          option: "charge_from_solar_and_grid"

                      # Stamp cooldown start: see architecture.md - Layer 4A - Grid Charge Export Cooldown
                      - service: input_datetime.set_datetime
                        target:
                          entity_id: input_datetime.last_grid_charge_command_time
                        data:
                          timestamp: "{{ now().timestamp() }}"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_charge_limit
                        data:
                          value: "{{ states('input_number.dynamic_charge_limit') | float(0) }}"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_discharge_limit
                        data:
                          value: 0

                  # Below and PV <= load and BattForecast is discharging: maximize self consumption, discharge limit 0
                  - conditions:
                      - condition: template
                        value_template: "{{ (pv <= house_load) and (pv > 0) and (batt_fc >=0) }}"
                    sequence:
            # Shadow/requested state
                      - service: input_select.select_option
                        target:
                          entity_id: input_select.emhass_requested_storage_mode
                        data:
                          option: "maximize_self_consumption"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_charge_limit
                        data:
                          value: "{{ states('input_number.dynamic_charge_limit') | float(0) }}"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_discharge_limit
                        data:
                          value: 0


                  # Below and No PV, BattForecast is charging and GridForecast is import
                  - conditions:
                      - condition: template
                        value_template: "{{ (pv == 0) and (batt_fc < 0) and (grid_fc > 0) }}"
                    sequence:
            # Shadow/requested state
                      - service: input_select.select_option
                        target:
                          entity_id: input_select.emhass_requested_storage_mode
                        data:
                          option: "charge_from_solar_and_grid"

                      # Stamp cooldown start: see architecture.md - Layer 4A - Grid Charge Export Cooldown
                      - service: input_datetime.set_datetime
                        target:
                          entity_id: input_datetime.last_grid_charge_command_time
                        data:
                          timestamp: "{{ now().timestamp() }}"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_charge_limit
                        data:
                          value: "{{ states('input_number.dynamic_charge_limit') | float(0) }}"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_discharge_limit
                        data:
                          value: 0


                  # Below and No PV, BattForecast is discharging
                  - conditions:
                      - condition: template
                        value_template: "{{ (pv == 0) and (batt_fc > 0) }}"
                    sequence:
            # Shadow/requested state
                      - service: input_select.select_option
                        target:
                          entity_id: input_select.emhass_requested_storage_mode
                        data:
                          option: "solar_power_only"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_charge_limit
                        data:
                          value: 0

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_discharge_limit
                        data:
                          value: 0


                  # Below and no PV, batt_fc < 0 (charging) and grid_fc <= 0 (0 or discharging)
                  - conditions:
                      - condition: template
                        value_template: "{{ (pv == 0) and (batt_fc < 0) and (grid_fc <= 0) }}"
                    sequence:
            # Shadow/requested state
                      - service: input_select.select_option
                        target:
                          entity_id: input_select.emhass_requested_storage_mode
                        data:
                          option: "solar_power_only"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_charge_limit
                        data:
                          value: 0

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_discharge_limit
                        data:
                          value: 0

                  # Below and No PV, BattForecast is 0, grid is import and price hasn't risen >20%
                  # ===== PRICE-BASED FALLBACK (LAST) =====
                  # Requires sensor.total_import_price to be available - a missing/
                  # unknown price falls back to price_import=0 via | float(0), which
                  # would otherwise misread as "price is free" and trigger a real
                  # grid charge regardless of actual price. When the price sensor is
                  # down, this branch is skipped and control falls through to the
                  # solar-only catch-all below.
                  # See known_issues_and_fixes.md - EMHASS Outage Fallback Guard.
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ (pv == 0) and (batt_fc==0)
                             and (states('sensor.total_import_price') not in ['unavailable', 'unknown'])
                             and (price_import <= last_average_chargingprice) }}
                    sequence:
            # Shadow/requested state
                      - service: input_select.select_option
                        target:
                          entity_id: input_select.emhass_requested_storage_mode
                        data:
                          option: "charge_from_solar_and_grid"

                      # Stamp cooldown start: see architecture.md - Layer 4A - Grid Charge Export Cooldown
                      - service: input_datetime.set_datetime
                        target:
                          entity_id: input_datetime.last_grid_charge_command_time
                        data:
                          timestamp: "{{ now().timestamp() }}"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_charge_limit
                        data:
                          value: "{{ states('input_number.dynamic_charge_limit') | float(0) }}"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_discharge_limit
                        data:
                          value: 0


                  # Below and No PV, BattForecast is 0: reached only if the price-based
                  # fallback above didn't match - solar-only regardless of grid_fc sign.
                  - conditions:
                      - condition: template
                        value_template: "{{ (pv == 0) and (batt_fc == 0) }}"
                    sequence:
            # Shadow/requested state
                      - service: input_select.select_option
                        target:
                          entity_id: input_select.emhass_requested_storage_mode
                        data:
                          option: "solar_power_only"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_charge_limit
                        data:
                          value: 0

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_discharge_limit
                        data:
                          value: 0

          # ===== DISCHARGE MAX EXPORT =====
          # SOC is maintain or above, EV is off, GridForecast is export, BattForecast is
          # discharge or flat. Still subject to the Grid Charge Export Cooldown check below,
          # so a recent grid-assisted charge is not immediately sold back.
          - conditions:
              - condition: template
                value_template: "{{ (maintain or above) and (soc > soc_min) and (grid_fc < 0) and (batt_fc >= 0) }}"
            sequence:
              - choose:

                  # Grid Charge Export Cooldown elapsed (or no recent grid charge): normal max-export.
                  # See architecture.md - Layer 4A - Grid Charge Export Cooldown.
                  - conditions:
                      - condition: template
                        value_template: "{{ cooldown_elapsed }}"
                    sequence:
            # Shadow/requested state
                      - service: input_select.select_option
                        target:
                          entity_id: input_select.emhass_requested_storage_mode
                        data:
                          option: "discharge_to_maximize_export"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_charge_limit
                        data:
                          value: 0

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_discharge_limit
                        data:
                          value: "{{ states('input_number.dynamic_discharge_limit') | float(0) }}"

              # Still within cooldown of a grid-assisted charge: do not sell it straight back out.
              # Stay in normal self-consumption instead of forcing export.
                default:
            # Shadow/requested state
                  - service: input_select.select_option
                    target:
                      entity_id: input_select.emhass_requested_storage_mode
                    data:
                      option: "maximize_self_consumption"

                  - service: input_number.set_value
                    target:
                      entity_id: input_number.emhass_requested_charge_limit
                    data:
                      value: 0

                  - service: input_number.set_value
                    target:
                      entity_id: input_number.emhass_requested_discharge_limit
                    data:
                      value: "{{ states('input_number.dynamic_discharge_limit') | float(0) }}"


          # ===== DISCHARGE MIN IMPORT / MAX SELF-CONSUMPTION =====
          # Above and grid_fc >= 0 (import or 0), any batt_fc sign.
          - conditions:
              - condition: template
                value_template: "{{ above and (grid_fc >= 0) and (soc > soc_min) }}"
            sequence:
            # Shadow/requested state
              - service: input_select.select_option
                target:
                  entity_id: input_select.emhass_requested_storage_mode
                data:
                  option: "maximize_self_consumption"

              - service: input_number.set_value
                target:
                  entity_id: input_number.emhass_requested_charge_limit
                data:
                  value: "{{ states('input_number.dynamic_charge_limit') | float(0) }}"

              - service: input_number.set_value
                target:
                  entity_id: input_number.emhass_requested_discharge_limit
                data:
                  value: "{{ states('input_number.dynamic_discharge_limit') | float(0) }}"


          # ===== MAINTAIN ZONE =====
          - conditions:
              - condition: template
                value_template: "{{ maintain }}"
            sequence:
              - choose:

                  # PV > load: allow max charge, dynamic discharge (EV charging allowed)
                  - conditions:
                      - condition: template
                        value_template: "{{ (pv_now > house_load_now) and (soc < (target + db)) }}"
                    sequence:
            # Shadow/requested state
                      - service: input_select.select_option
                        target:
                          entity_id: input_select.emhass_requested_storage_mode
                        data:
                          option: "maximize_self_consumption"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_charge_limit
                        data:
                          value: 5000

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_discharge_limit
                        data:
                          value: "{{ states('input_number.dynamic_discharge_limit') | float(0) }}"


                  # Normal maintain zone: dynamic charge and discharge limits
                  - conditions:
                      - condition: template
                        value_template: "{{ (pv_now <= house_load_now) or (batt_fc < 0) }}"
                    sequence:
            # Shadow/requested state
                      - service: input_select.select_option
                        target:
                          entity_id: input_select.emhass_requested_storage_mode
                        data:
                          option: "maximize_self_consumption"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_charge_limit
                        data:
                          value: "{{ states('input_number.dynamic_charge_limit') | float(0) }}"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_discharge_limit
                        data:
                          value: "{{ states('input_number.dynamic_discharge_limit') | float(0) }}"


                  # Fallback: only reached when pv_now > house_load_now
                  # (real PV surplus exists) AND batt_fc >= 0 AND soc is
                  # exactly at the deadband's upper edge - see the two
                  # preceding branches' conditions. Was solar_power_only
                  # until 2026-11-03: that mode was found live to charge
                  # from PV surplus despite charge_limit=0 (see
                  # known_issues_and_fixes.md, High SOC Hold..., Update
                  # 2026-11-03), and this is the one Maintain Zone branch
                  # where real PV surplus (pv_now > house_load_now) is
                  # actually present when it fires - exactly the condition
                  # that defect needs. Switched to discharge_to_maximize_
                  # export with discharge pinned to 0 (the closest
                  # available equivalent to "stay flat, do nothing" now
                  # that Solar Power Only can't be trusted for that), since
                  # that mode was separately confirmed to honor
                  # charge_limit=0 under the same live PV-surplus
                  # conditions. The other three solar_power_only branches
                  # in this file (BELOW-SOC, all gated on pv == 0) were
                  # left unchanged - with no real PV surplus present when
                  # they fire, this defect's trigger condition doesn't
                  # apply; see that Update for the full reasoning.
                  - conditions: []
                    sequence:
            # Shadow/requested state
                      - service: input_select.select_option
                        target:
                          entity_id: input_select.emhass_requested_storage_mode
                        data:
                          option: "discharge_to_maximize_export"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_charge_limit
                        data:
                          value: 0

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.emhass_requested_discharge_limit
                        data:
                          value: 0