# ── safety_limits_and_override.yaml ──
# Layer 1: applies SOC safety limits, high-SOC hold, grid-export/negative-price blocks, and EV constraints to Layer 4A's requested values.
# Sets: input_select.effective_storage_mode, input_number.effective_charge/discharge_limit, input_boolean.battery_high_soc_hold
# Deps: input_select/number.emhass_requested_*, sensor.solaredge_b1_state_of_energy  →  apply_effective_battery_control.yaml
# Fixes: known_issues_and_fixes.md (SOC-Sensor False-Trigger, EV Charging Sensor Swap, High SOC Hold mode-switch fix 2026-11-02)

automation:

  - id: calculate_effective_battery_control
    alias: "Calculate Effective Battery Control"
    mode: restart

    trigger:
      - platform: state
        entity_id:
          - input_select.emhass_requested_storage_mode
          - input_number.emhass_requested_charge_limit
          - input_number.emhass_requested_discharge_limit
          - binary_sensor.ev_charging_active
          - input_boolean.grid_export_blocked
          - input_boolean.grid_export_limited
          - input_boolean.negative_price_active
          - input_boolean.battery_high_soc_hold
          - sensor.solaredge_b1_state_of_energy
          - input_number.maximum_state_of_charge
          - input_number.minimum_state_of_charge

    condition:
      # SOC sensor unavailable/unknown guard - freezes effective_* at last
      # good values instead of computing from a fake soc=0.
      # See known_issues_and_fixes.md - Modbus Connectivity - SOC-Sensor
      # Unavailable False-Trigger.
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.solaredge_b1_state_of_energy
            state:
              - "unavailable"
              - "unknown"

    action:
      - variables:
          soc: "{{ states('sensor.solaredge_b1_state_of_energy') | float(0) }}"
          soc_max: "{{ states('input_number.maximum_state_of_charge') | float(90) }}"
          soc_min: "{{ states('input_number.minimum_state_of_charge') | float(20) }}"

          requested_mode: "{{ states('input_select.emhass_requested_storage_mode') }}"
          requested_charge: "{{ states('input_number.emhass_requested_charge_limit') | float(0) }}"
          requested_discharge: "{{ states('input_number.emhass_requested_discharge_limit') | float(0) }}"
          dynamic_charge: "{{ states('input_number.dynamic_charge_limit') | float(0) }}"

          ev_charging: "{{ is_state('binary_sensor.ev_charging_active', 'on') }}"
          grid_export_blocked: "{{ is_state('input_boolean.grid_export_blocked', 'on') }}"
          grid_export_limited: "{{ is_state('input_boolean.grid_export_limited', 'on') }}"
          negative_price_active: "{{ is_state('input_boolean.negative_price_active', 'on') }}"


      - choose:
          # 0. SOC < 10 - CRITICAL RECOVERY
          - conditions:
              - condition: template
                value_template: "{{ soc < 10 }}"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.effective_storage_mode
                data:
                  option: "charge_from_solar_and_grid"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_charge_limit
                data:
                  value: 3000

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_discharge_limit
                data:
                  value: 0

              - service: input_text.set_value
                target:
                  entity_id: input_text.effective_battery_reason
                data:
                  value: "SOC critical below 10 - forced recovery charge"

          # 1. SOC < MIN
          # Normal low-SOC recovery. Stop discharge and charge dynamically.
          - conditions:
              - condition: template
                value_template: "{{ soc < soc_min }}"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.effective_storage_mode
                data:
                  option: "charge_from_solar_and_grid"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_charge_limit
                data:
                  value: "{{ [requested_charge, dynamic_charge] | max }}"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_discharge_limit
                data:
                  value: 0

              - service: input_text.set_value
                target:
                  entity_id: input_text.effective_battery_reason
                data:
                  value: "SOC below minimum - dynamic recovery charge"

          # HIGH SOC HOLD
          # Preserve charge without forcing export.
          #
          # UPDATED 2026-11-02 (see known_issues_and_fixes.md - High SOC
          # Hold - Charge Limit = 0 Does Not Stop Charging While Maximize
          # Self Consumption Stays Active): switched from
          # maximize_self_consumption to discharge_to_minimize_import,
          # discharge limit pinned to 0 (not the dynamic requested_discharge
          # used before). MSC was confirmed live to keep charging the
          # battery past charge_limit=0 whenever PV surplus was available
          # (11 Hold cycles, 2026-10-22 to 2026-11-01, 10 of 11 climbed all
          # the way to 100% SOC regardless) - MSC's own self-consumption
          # logic evidently overrides the charge-limit register while that
          # mode stays active. Discharge to Minimize Import never exports
          # from the battery and, per this project's own README, is a
          # distinct SolarEdge command mode rather than a cap layered on top
          # of self-consumption logic - the fix direction the user chose
          # over switching to Solar Power Only (which would also block
          # discharge entirely) specifically to keep the battery able to
          # offset house load during Hold rather than sitting fully idle.
          # Pinning the discharge limit to 0 here (rather than
          # requested_discharge) keeps the battery passive by default
          # while Hold is on, rather than actively discharging to cover
          # load - matches the user's explicit request ("keep discharge
          # limit to 0 when hitting the SOC roof").
          #
          # NOT YET VERIFIED LIVE: whether this mode actually blocks
          # charging from PV surplus the way Solar Power Only is
          # documented to (README only describes its discharge behaviour)
          # is unconfirmed - if SOC is still observed climbing past the
          # ceiling under this mode, the documented fallback is to switch
          # the option below to "solar_power_only" instead (see
          # known_issues_and_fixes.md for the full fix write-up and the
          # fallback plan).

          - conditions:
              - condition: state
                entity_id: input_boolean.battery_high_soc_hold
                state: "on"

            sequence:

              - service: input_select.select_option
                target:
                  entity_id: input_select.effective_storage_mode
                data:
                  option: "discharge_to_minimize_import"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_charge_limit
                data:
                  value: 0

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_discharge_limit
                data:
                  value: 0

              - service: input_text.set_value
                target:
                  entity_id: input_text.effective_battery_reason
                data:
                  value: "High SOC hold - discharge to minimize import, charge blocked"


          # 3. GRID EXPORT BLOCKED / NEGATIVE PRICE
          # Normal SOC range: block battery discharge/export.
          - conditions:
              - condition: template
                value_template: "{{ grid_export_blocked or negative_price_active }}"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.effective_storage_mode
                data:
                  option: "maximize_self_consumption"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_charge_limit
                data:
                  value: "{{ requested_charge }}"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_discharge_limit
                data:
                  value: 0

              - service: input_text.set_value
                target:
                  entity_id: input_text.effective_battery_reason
                data:
                  value: "Export blocked or negative price - battery discharge blocked"

          # 4. EV CHARGING
          # Normal SOC range: allow only minimal battery support.
          - conditions:
              - condition: template
                value_template: "{{ ev_charging }}"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.effective_storage_mode
                data:
                  option: "{{ requested_mode }}"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_charge_limit
                data:
                  value: "{{ requested_charge }}"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_discharge_limit
                data:
                  value: 100

              - service: input_text.set_value
                target:
                  entity_id: input_text.effective_battery_reason
                data:
                  value: "EV charging - battery discharge limited"

        # 6. NORMAL CASE
        default:
          - service: input_select.select_option
            target:
              entity_id: input_select.effective_storage_mode
            data:
              option: "{{ requested_mode }}"

          - service: input_number.set_value
            target:
              entity_id: input_number.effective_charge_limit
            data:
              value: "{{ requested_charge }}"

          - service: input_number.set_value
            target:
              entity_id: input_number.effective_discharge_limit
            data:
              value: "{{ requested_discharge }}"

          - service: input_text.set_value
            target:
              entity_id: input_text.effective_battery_reason
            data:
              value: "Normal - effective follows requested"

  # High SOC Hold hysteresis - see architecture.md (Layer 1 - High SOC Hold).
  - id: battery_high_soc_hold
    alias: Battery High SOC Hold
    mode: single

    trigger:
      - platform: state
        entity_id:
          - sensor.solaredge_b1_state_of_energy
          - input_number.maximum_state_of_charge

    condition:
      # SOC sensor unavailable/unknown guard.
      # See known_issues_and_fixes.md - Modbus Connectivity - SOC-Sensor
      # Unavailable False-Trigger.
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.solaredge_b1_state_of_energy
            state:
              - "unavailable"
              - "unknown"

    variables:
      soc: "{{ states('sensor.solaredge_b1_state_of_energy') | float(0) }}"
      soc_max: "{{ states('input_number.maximum_state_of_charge') | float(90) }}"

    action:
      - choose:

          # Enter hold
          - conditions:
              - condition: template
                value_template: >
                  {{ (soc >= (soc_max-1)) and
                     is_state('input_boolean.battery_high_soc_hold','off') }}
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.battery_high_soc_hold

          # Exit hold
          - conditions:
              - condition: template
                value_template: >
                  {{ (soc <= (soc_max-3)) and
                     is_state('input_boolean.battery_high_soc_hold','on') }}
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.battery_high_soc_hold