# ── safety_limits_and_override.yaml ──
# Layer 1: applies SOC safety limits, high-SOC hold, grid-export/negative-price blocks, and EV constraints to Layer 4A's requested values.
# Sets: input_select.effective_storage_mode, input_number.effective_charge/discharge_limit, input_boolean.battery_high_soc_hold
# Deps: input_select/number.emhass_requested_*, sensor.solaredge_b1_state_of_energy  →  apply_effective_battery_control.yaml
# Fixes: known_issues_and_fixes.md (SOC-Sensor False-Trigger, EV Charging Sensor Swap, High SOC Hold mode-switch fix 2026-11-02, High SOC Hold day/night split 2026-11-02)

automation:

  - id: calculate_effective_battery_control
    alias: "Calculate Effective Battery Control"
    mode: restart

    trigger:
      - platform: state
        entity_id:
          - input_select.emhass_requested_storage_mode
          - input_number.emhass_requested_charge_limit
          - input_number.emhass_requested_discharge_limit
          - binary_sensor.ev_charging_active
          - input_boolean.grid_export_blocked
          - input_boolean.grid_export_limited
          - input_boolean.negative_price_active
          - input_boolean.battery_high_soc_hold
          - sensor.solaredge_b1_state_of_energy
          - input_number.maximum_state_of_charge
          - input_number.minimum_state_of_charge
          - sensor.solar_panel_production_w

    condition:
      # SOC sensor unavailable/unknown guard - freezes effective_* at last
      # good values instead of computing from a fake soc=0.
      # See known_issues_and_fixes.md - Modbus Connectivity - SOC-Sensor
      # Unavailable False-Trigger.
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.solaredge_b1_state_of_energy
            state:
              - "unavailable"
              - "unknown"

    action:
      - variables:
          soc: "{{ states('sensor.solaredge_b1_state_of_energy') | float(0) }}"
          soc_max: "{{ states('input_number.maximum_state_of_charge') | float(90) }}"
          soc_min: "{{ states('input_number.minimum_state_of_charge') | float(20) }}"

          requested_mode: "{{ states('input_select.emhass_requested_storage_mode') }}"
          requested_charge: "{{ states('input_number.emhass_requested_charge_limit') | float(0) }}"
          requested_discharge: "{{ states('input_number.emhass_requested_discharge_limit') | float(0) }}"
          dynamic_charge: "{{ states('input_number.dynamic_charge_limit') | float(0) }}"

          ev_charging: "{{ is_state('binary_sensor.ev_charging_active', 'on') }}"
          grid_export_blocked: "{{ is_state('input_boolean.grid_export_blocked', 'on') }}"
          grid_export_limited: "{{ is_state('input_boolean.grid_export_limited', 'on') }}"
          negative_price_active: "{{ is_state('input_boolean.negative_price_active', 'on') }}"

          # Day/night split for High SOC Hold below - same raw sensor and
          # noise floor as battery_forecast_control.yaml's pv_now (Layer
          # 4A), re-applied here since Layer 1 doesn't otherwise see PV at
          # all. See known_issues_and_fixes.md - PV Sensor Trickle
          # Readings Bypass the "No PV" Branch Logic.
          pv_now: >-
            {% set raw_now = states('sensor.solar_panel_production_w') | float(0) %}
            {{ 0 if raw_now < (states('input_number.pv_noise_floor_w') | float(20)) else raw_now }}


      - choose:
          # 0. SOC < 10 - CRITICAL RECOVERY
          - conditions:
              - condition: template
                value_template: "{{ soc < 10 }}"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.effective_storage_mode
                data:
                  option: "charge_from_solar_and_grid"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_charge_limit
                data:
                  value: 3000

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_discharge_limit
                data:
                  value: 0

              - service: input_text.set_value
                target:
                  entity_id: input_text.effective_battery_reason
                data:
                  value: "SOC critical below 10 - forced recovery charge"

          # 1. SOC < MIN
          # Normal low-SOC recovery. Stop discharge and charge dynamically.
          - conditions:
              - condition: template
                value_template: "{{ soc < soc_min }}"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.effective_storage_mode
                data:
                  option: "charge_from_solar_and_grid"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_charge_limit
                data:
                  value: "{{ [requested_charge, dynamic_charge] | max }}"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_discharge_limit
                data:
                  value: 0

              - service: input_text.set_value
                target:
                  entity_id: input_text.effective_battery_reason
                data:
                  value: "SOC below minimum - dynamic recovery charge"

          # HIGH SOC HOLD
          # Updated 2026-11-02 (second time today): split by PV presence
          # instead of a single mode for the whole Hold period. Day (PV
          # above the noise floor): solar_power_only - the battery is
          # fully idle, no charge AND no discharge path at all, closing
          # off the MSC-overrides-charge-limit-0 vulnerability entirely
          # rather than relying on a mode whose charge behavior under PV
          # surplus turned out not to be safely assumable (see
          # known_issues_and_fixes.md - High SOC Hold - Charge Limit = 0
          # Does Not Stop Charging While Maximize Self Consumption Stays
          # Active, and its two 2026-11-02 Updates). Night (PV at/below
          # the floor): discharge_to_maximize_export - no PV means no risk
          # of it recharging the battery, so instead of sitting idle,
          # proactively discharge toward export to bring SOC down before
          # the next day's solar. Both modes were already selectable in
          # input_select.effective_storage_mode and already wired through
          # apply_effective_battery_control.yaml's choose: block before
          # today - no new plumbing needed for either one. Not yet
          # verified live against a real Hold cycle in either branch.
          # Whatever happens inside this branch, the Battery Control
          # Drift Watchdog (watchdog_automations.yaml) now re-applies and
          # flags it if the live inverter doesn't actually end up
          # matching what's set here - see known_issues_and_fixes.md.

          - conditions:
              - condition: state
                entity_id: input_boolean.battery_high_soc_hold
                state: "on"

            sequence:
              - choose:
                  # Day: PV present above the noise floor - idle the
                  # battery entirely rather than trust any mode's charge
                  # behavior under PV surplus.
                  - conditions:
                      - condition: template
                        value_template: "{{ pv_now > 0 }}"
                    sequence:
                      - service: input_select.select_option
                        target:
                          entity_id: input_select.effective_storage_mode
                        data:
                          option: "solar_power_only"

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.effective_charge_limit
                        data:
                          value: 0

                      - service: input_number.set_value
                        target:
                          entity_id: input_number.effective_discharge_limit
                        data:
                          value: 0

                      - service: input_text.set_value
                        target:
                          entity_id: input_text.effective_battery_reason
                        data:
                          value: "High SOC hold - daytime (PV present), solar power only, battery idle"

                # Night: PV at/below the noise floor - no recharge risk,
                # so discharge toward export instead of sitting idle.
                default:
                  - service: input_select.select_option
                    target:
                      entity_id: input_select.effective_storage_mode
                    data:
                      option: "discharge_to_maximize_export"

                  - service: input_number.set_value
                    target:
                      entity_id: input_number.effective_charge_limit
                    data:
                      value: 0

                  - service: input_number.set_value
                    target:
                      entity_id: input_number.effective_discharge_limit
                    data:
                      value: "{{ states('input_number.dynamic_discharge_limit') | float(0) }}"

                  - service: input_text.set_value
                    target:
                      entity_id: input_text.effective_battery_reason
                    data:
                      value: "High SOC hold - nighttime (no PV), discharge to maximize export"


          # 3. GRID EXPORT BLOCKED / NEGATIVE PRICE
          # Normal SOC range: block battery discharge/export.
          - conditions:
              - condition: template
                value_template: "{{ grid_export_blocked or negative_price_active }}"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.effective_storage_mode
                data:
                  option: "maximize_self_consumption"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_charge_limit
                data:
                  value: "{{ requested_charge }}"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_discharge_limit
                data:
                  value: 0

              - service: input_text.set_value
                target:
                  entity_id: input_text.effective_battery_reason
                data:
                  value: "Export blocked or negative price - battery discharge blocked"

          # 4. EV CHARGING
          # Normal SOC range: allow only minimal battery support.
          - conditions:
              - condition: template
                value_template: "{{ ev_charging }}"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.effective_storage_mode
                data:
                  option: "{{ requested_mode }}"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_charge_limit
                data:
                  value: "{{ requested_charge }}"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_discharge_limit
                data:
                  value: 100

              - service: input_text.set_value
                target:
                  entity_id: input_text.effective_battery_reason
                data:
                  value: "EV charging - battery discharge limited"

        # 6. NORMAL CASE
        default:
          - service: input_select.select_option
            target:
              entity_id: input_select.effective_storage_mode
            data:
              option: "{{ requested_mode }}"

          - service: input_number.set_value
            target:
              entity_id: input_number.effective_charge_limit
            data:
              value: "{{ requested_charge }}"

          - service: input_number.set_value
            target:
              entity_id: input_number.effective_discharge_limit
            data:
              value: "{{ requested_discharge }}"

          - service: input_text.set_value
            target:
              entity_id: input_text.effective_battery_reason
            data:
              value: "Normal - effective follows requested"

  # High SOC Hold hysteresis - see architecture.md (Layer 1 - High SOC Hold).
  - id: battery_high_soc_hold
    alias: Battery High SOC Hold
    mode: single

    trigger:
      - platform: state
        entity_id:
          - sensor.solaredge_b1_state_of_energy
          - input_number.maximum_state_of_charge

    condition:
      # SOC sensor unavailable/unknown guard.
      # See known_issues_and_fixes.md - Modbus Connectivity - SOC-Sensor
      # Unavailable False-Trigger.
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.solaredge_b1_state_of_energy
            state:
              - "unavailable"
              - "unknown"

    variables:
      soc: "{{ states('sensor.solaredge_b1_state_of_energy') | float(0) }}"
      soc_max: "{{ states('input_number.maximum_state_of_charge') | float(90) }}"

    action:
      - choose:

          # Enter hold
          - conditions:
              - condition: template
                value_template: >
                  {{ (soc >= (soc_max-1)) and
                     is_state('input_boolean.battery_high_soc_hold','off') }}
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.battery_high_soc_hold

          # Exit hold
          - conditions:
              - condition: template
                value_template: >
                  {{ (soc <= (soc_max-3)) and
                     is_state('input_boolean.battery_high_soc_hold','on') }}
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.battery_high_soc_hold