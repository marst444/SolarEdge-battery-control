# ── safety_limits_and_override.yaml ──
# Layer 1: applies SOC safety limits, high-SOC hold, grid-export/negative-price blocks, and EV constraints to Layer 4A's requested values.
# Sets: input_select.effective_storage_mode, input_number.effective_charge/discharge_limit, input_boolean.battery_high_soc_hold
# Deps: input_select/number.emhass_requested_*, sensor.solaredge_b1_state_of_energy, sensor.pv_production_smoothed  →  apply_effective_battery_control.yaml
# Fixes: known_issues_and_fixes.md (SOC-Sensor False-Trigger, EV Charging Sensor Swap, High SOC Hold mode-switch fix 2026-11-02, High SOC Hold day/night split 2026-11-02, Update 2026-11-03 - Day/Night Split Mode-Flapping on Raw PV, Update 2026-11-03 - Solar Power Only Replaced With Discharge to Maximize Export)

automation:

  - id: calculate_effective_battery_control
    alias: "Calculate Effective Battery Control"
    mode: restart

    trigger:
      - platform: state
        entity_id:
          - input_select.emhass_requested_storage_mode
          - input_number.emhass_requested_charge_limit
          - input_number.emhass_requested_discharge_limit
          - binary_sensor.ev_charging_active
          - input_boolean.grid_export_blocked
          - input_boolean.grid_export_limited
          - input_boolean.negative_price_active
          - input_boolean.battery_high_soc_hold
          - sensor.solaredge_b1_state_of_energy
          - input_number.maximum_state_of_charge
          - input_number.minimum_state_of_charge
          # Smoothed, not raw - see pv_now comment below and
          # known_issues_and_fixes.md, Update 2026-11-03. Triggering on the
          # raw sensor re-evaluated (and could flip) the Hold day/night
          # branch on every momentary PV blip, far more often than the mode
          # it selects could actually be applied.
          - sensor.pv_production_smoothed

    condition:
      # SOC sensor unavailable/unknown guard - freezes effective_* at last
      # good values instead of computing from a fake soc=0.
      # See known_issues_and_fixes.md - Modbus Connectivity - SOC-Sensor
      # Unavailable False-Trigger.
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.solaredge_b1_state_of_energy
            state:
              - "unavailable"
              - "unknown"

    action:
      - variables:
          soc: "{{ states('sensor.solaredge_b1_state_of_energy') | float(0) }}"
          soc_max: "{{ states('input_number.maximum_state_of_charge') | float(90) }}"
          soc_min: "{{ states('input_number.minimum_state_of_charge') | float(20) }}"

          requested_mode: "{{ states('input_select.emhass_requested_storage_mode') }}"
          requested_charge: "{{ states('input_number.emhass_requested_charge_limit') | float(0) }}"
          requested_discharge: "{{ states('input_number.emhass_requested_discharge_limit') | float(0) }}"
          dynamic_charge: "{{ states('input_number.dynamic_charge_limit') | float(0) }}"

          ev_charging: "{{ is_state('binary_sensor.ev_charging_active', 'on') }}"
          grid_export_blocked: "{{ is_state('input_boolean.grid_export_blocked', 'on') }}"
          grid_export_limited: "{{ is_state('input_boolean.grid_export_limited', 'on') }}"
          negative_price_active: "{{ is_state('input_boolean.negative_price_active', 'on') }}"

          # Day/night split for High SOC Hold below. Updated 2026-11-03:
          # uses the same 4-minute trailing-mean sensor
          # (sensor.pv_production_smoothed, batterycontrol_sensors.yaml) and
          # noise floor as battery_forecast_control.yaml's mode-selecting
          # `pv` variable (Layer 4A) - NOT that automation's raw/instantaneous
          # `pv_now` variable, despite this variable's old name here. The
          # original 2026-11-02 version of this branch used the raw,
          # instantaneous sensor.solar_panel_production_w for this exact
          # purpose, which is the one thing Layer 4A's own PV/Load Sampling
          # Smoothing design (architecture.md) explicitly says never to do
          # for a mode-selecting decision - see known_issues_and_fixes.md,
          # Update 2026-11-03 - Day/Night Split Mode-Flapping on Raw PV, for
          # the live incident (effective_storage_mode flipping every ~90s
          # for hours on a variable-cloud day, 40+ drift-watchdog corrections
          # in one morning) that this fixes. Named `pv` (not `pv_now`) to
          # avoid exactly that naming confusion going forward.
          pv: >-
            {% set smoothed = states('sensor.pv_production_smoothed') | float(0) %}
            {{ 0 if smoothed < (states('input_number.pv_noise_floor_w') | float(20)) else smoothed }}


      - choose:
          # 0. SOC < 10 - CRITICAL RECOVERY
          - conditions:
              - condition: template
                value_template: "{{ soc < 10 }}"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.effective_storage_mode
                data:
                  option: "charge_from_solar_and_grid"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_charge_limit
                data:
                  value: 3000

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_discharge_limit
                data:
                  value: 0

              - service: input_text.set_value
                target:
                  entity_id: input_text.effective_battery_reason
                data:
                  value: "SOC critical below 10 - forced recovery charge"

          # 1. SOC < MIN
          # Normal low-SOC recovery. Stop discharge and charge dynamically.
          - conditions:
              - condition: template
                value_template: "{{ soc < soc_min }}"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.effective_storage_mode
                data:
                  option: "charge_from_solar_and_grid"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_charge_limit
                data:
                  value: "{{ [requested_charge, dynamic_charge] | max }}"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_discharge_limit
                data:
                  value: 0

              - service: input_text.set_value
                target:
                  entity_id: input_text.effective_battery_reason
                data:
                  value: "SOC below minimum - dynamic recovery charge"

          # HIGH SOC HOLD
          # Updated 2026-11-03: Solar Power Only (Off) - the day branch's
          # mode as of the 2026-11-02 day/night split below it - was found
          # live to NOT actually idle the battery: it charged at ~350-430W
          # (tracking PV almost exactly) despite a correctly-dispatched
          # mode command and charge_limit confirmed held at 0 throughout.
          # Discharge to Maximize Export (the night branch's mode) was
          # checked against the same live conditions and DID correctly
          # stay at 0W/Standby - see known_issues_and_fixes.md, High SOC
          # Hold..., Update 2026-11-03 (later same day) and its "ruling
          # out a mixup" follow-up. Both branches now use Discharge to
          # Maximize Export - the only mode confirmed so far to honor
          # charge_limit=0 under real PV surplus - differing only in the
          # discharge ceiling: 0 by day (closest available equivalent to
          # "fully idle" now that Solar Power Only can't be trusted for
          # that), the dynamic value by night (unchanged - proactively
          # discharge toward export since there's no recharge risk).
          # Whatever happens inside this branch, the Battery Control
          # Drift Watchdog (watchdog_automations.yaml) re-applies and
          # flags it if the live inverter doesn't actually end up
          # matching what's set here - see known_issues_and_fixes.md.

          - conditions:
              - condition: state
                entity_id: input_boolean.battery_high_soc_hold
                state: "on"

            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.effective_storage_mode
                data:
                  option: "discharge_to_maximize_export"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_charge_limit
                data:
                  value: 0

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_discharge_limit
                data:
                  value: >-
                    {{ (states('input_number.dynamic_discharge_limit') | float(0))
                       if pv == 0 else 0 }}

              - service: input_text.set_value
                target:
                  entity_id: input_text.effective_battery_reason
                data:
                  value: >-
                    {{ "High SOC hold - daytime (PV present), discharge to maximize export, discharge capped 0"
                       if pv > 0 else
                       "High SOC hold - nighttime (no PV), discharge to maximize export" }}


          # 3. GRID EXPORT BLOCKED / NEGATIVE PRICE
          # Normal SOC range: block battery discharge/export.
          - conditions:
              - condition: template
                value_template: "{{ grid_export_blocked or negative_price_active }}"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.effective_storage_mode
                data:
                  option: "maximize_self_consumption"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_charge_limit
                data:
                  value: "{{ requested_charge }}"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_discharge_limit
                data:
                  value: 0

              - service: input_text.set_value
                target:
                  entity_id: input_text.effective_battery_reason
                data:
                  value: "Export blocked or negative price - battery discharge blocked"

          # 4. EV CHARGING
          # Normal SOC range: allow only minimal battery support.
          - conditions:
              - condition: template
                value_template: "{{ ev_charging }}"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.effective_storage_mode
                data:
                  option: "{{ requested_mode }}"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_charge_limit
                data:
                  value: "{{ requested_charge }}"

              - service: input_number.set_value
                target:
                  entity_id: input_number.effective_discharge_limit
                data:
                  value: 100

              - service: input_text.set_value
                target:
                  entity_id: input_text.effective_battery_reason
                data:
                  value: "EV charging - battery discharge limited"

        # 6. NORMAL CASE
        default:
          - service: input_select.select_option
            target:
              entity_id: input_select.effective_storage_mode
            data:
              option: "{{ requested_mode }}"

          - service: input_number.set_value
            target:
              entity_id: input_number.effective_charge_limit
            data:
              value: "{{ requested_charge }}"

          - service: input_number.set_value
            target:
              entity_id: input_number.effective_discharge_limit
            data:
              value: "{{ requested_discharge }}"

          - service: input_text.set_value
            target:
              entity_id: input_text.effective_battery_reason
            data:
              value: "Normal - effective follows requested"

  # High SOC Hold hysteresis - see architecture.md (Layer 1 - High SOC Hold).
  - id: battery_high_soc_hold
    alias: Battery High SOC Hold
    mode: single

    trigger:
      - platform: state
        entity_id:
          - sensor.solaredge_b1_state_of_energy
          - input_number.maximum_state_of_charge

    condition:
      # SOC sensor unavailable/unknown guard.
      # See known_issues_and_fixes.md - Modbus Connectivity - SOC-Sensor
      # Unavailable False-Trigger.
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.solaredge_b1_state_of_energy
            state:
              - "unavailable"
              - "unknown"

    variables:
      soc: "{{ states('sensor.solaredge_b1_state_of_energy') | float(0) }}"
      soc_max: "{{ states('input_number.maximum_state_of_charge') | float(90) }}"

    action:
      - choose:

          # Enter hold
          - conditions:
              - condition: template
                value_template: >
                  {{ (soc >= (soc_max-1)) and
                     is_state('input_boolean.battery_high_soc_hold','off') }}
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.battery_high_soc_hold

          # Exit hold
          - conditions:
              - condition: template
                value_template: >
                  {{ (soc <= (soc_max-3)) and
                     is_state('input_boolean.battery_high_soc_hold','on') }}
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.battery_high_soc_hold