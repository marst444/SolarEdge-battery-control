# ── safety_and_watchdog_helpers.yaml ──
# Layer 1: SOC/power safety limit definitions, EMHASS run-tracking timestamps, battery safety/override input_booleans, and Modbus write/queue diagnostic helpers.
# Sets: (definitions only - runtime values written by emhass_automations.yaml, safety_limits_and_override.yaml, solaredge_modbusqueue.yaml, apply_effective_battery_control.yaml)
# Deps: none (static)  →  safety_limits_and_override.yaml, watchdog_sensors.yaml, apply_effective_battery_control.yaml, solaredge_modbusqueue.yaml, watchdog_automations.yaml
# Fixes: known_issues_and_fixes.md; several safety-override booleans possibly unused - see roadmap.md

input_number:

  minimum_state_of_charge:
    name: Battery Min SOC
    initial: 20
    min: 0
    max: 100
    step: 1
    mode: box

  maximum_state_of_charge:
    name: Battery Max SOC
    initial: 90
    min: 0
    max: 100
    step: 1
    mode: box

  ac_maxpower:
    name: AC Max Power
    initial: 5000
    min: 5000
    max: 10000
    step: 100
    mode: box

  safety_min_discharge_limit:
    name: Safety Minimum Discharge Limit
    min: 0
    max: 5000
    step: 1
    unit_of_measurement: W
    mode: box
    initial: 1000

  safety_recovery_charge_limit:
    name: Safety Recovery Charge Limit
    min: 0
    max: 5000
    step: 1
    unit_of_measurement: W
    mode: box
    initial: 3000

  # Enhanced Diagnostics (Modbus write outcomes) - written by solaredge_modbusqueue.yaml
  modbus_write_success_count_total:
    name: Modbus Write Success Count Total
    min: 0
    max: 1000000
    step: 1
    mode: box
    initial: 0

  modbus_write_success_count_today:
    name: Modbus Write Success Count Today
    min: 0
    max: 1000000
    step: 1
    mode: box
    initial: 0

  modbus_write_failure_count_total:
    name: Modbus Write Failure Count Total
    min: 0
    max: 1000000
    step: 1
    mode: box
    initial: 0

  modbus_write_failure_count_today:
    name: Modbus Write Failure Count Today
    min: 0
    max: 1000000
    step: 1
    mode: box
    initial: 0

  modbus_write_consecutive_failures:
    name: Modbus Write Consecutive Failures
    min: 0
    max: 1000000
    step: 1
    mode: box
    initial: 0

  # Enhanced Diagnostics (queue depth) - written by solaredge_modbusqueue.yaml
  modbus_queue_pending_count:
    name: Modbus Queue Pending Count
    min: 0
    max: 1000
    step: 1
    mode: box
    initial: 0

  modbus_queue_last_command_delta:
    name: Modbus Queue Last Command Delta
    min: -1000000
    max: 1000000
    step: 1
    mode: box
    initial: 0

  # Enhanced Diagnostics (mode-select guard) - written by apply_effective_battery_control.yaml
  mode_command_skipped_count_total:
    name: Mode Command Skipped Count Total
    min: 0
    max: 1000000
    step: 1
    mode: box
    initial: 0

  mode_command_skipped_count_today:
    name: Mode Command Skipped Count Today
    min: 0
    max: 1000000
    step: 1
    mode: box
    initial: 0

input_datetime:

  emhass_last_dayahead_run:
    name: EMHASS Last Dayahead Run
    has_date: true
    has_time: true

  emhass_last_mpc_run:
    name: EMHASS Last MPC Run
    has_date: true
    has_time: true

  emhass_dayahead_last_success:
    name: EMHASS Dayahead last success
    has_date: true
    has_time: true

  emhass_mpc_last_success:
    name: EMHASS MPC last success
    has_date: true
    has_time: true

  emhass_addon_last_restart_attempt:
    name: EMHASS Addon Last Restart Attempt
    has_date: true
    has_time: true

input_text:

  emhass_mpc_status:
    name: EMHASS MPC status

  emhass_dayahead_status:
    name: EMHASS dayahead status

  effective_battery_reason:
    name: Effective Battery Reason
    max: 255

  # Enhanced Diagnostics (Modbus write outcomes) - written by solaredge_modbusqueue.yaml
  modbus_last_successful_write:
    name: Modbus Last Successful Write
    max: 255

  modbus_last_failed_write:
    name: Modbus Last Failed Write
    max: 255

  modbus_last_failed_reason:
    name: Modbus Last Failed Reason
    max: 255

input_boolean:
  battery_safety_override_active:
    name: Battery Safety Override Active
    icon: mdi:shield-alert

  battery_force_discharge:
    name: Battery Force Discharge
    icon: mdi:battery-arrow-down

  battery_force_charge:
    name: Battery Force Charge
    icon: mdi:battery-arrow-up

  battery_discharge_blocked:
    name: Battery Discharge Blocked
    icon: mdi:battery-off

  battery_charge_blocked:
    name: Battery Charge Blocked
    icon: mdi:battery-off-outline

  battery_high_soc_hold:
    name: Battery High SOC Hold
    icon: mdi:battery-off-outline


# Killswitch for whole battery control system.
  effective_battery_control_enabled:
    name: Effective Battery Control Enabled
    icon: mdi:battery-cog