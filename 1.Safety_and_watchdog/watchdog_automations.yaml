# ── watchdog_automations.yaml ──
# Layer 1: notifies on missing day-ahead run; notifies AND forces Maximize Self Consumption fallback after 45 min MPC stall; auto-restarts EMHASS addon after 90 min stall (max 1/hr); detects live inverter drift from the intended effective battery control state and force-re-applies it; resets daily diagnostic counters at midnight.
# Sets: input_datetime.emhass_addon_last_restart_attempt, input_number.modbus_write_success_count_today/_failure_count_today/mode_command_skipped_count_today/battery_control_drift_count_total/_today, input_text.battery_control_last_drift_reason, input_select.emhass_requested_storage_mode, input_number.emhass_requested_charge_limit/_discharge_limit (fallback only)
# Deps: input_datetime.emhass_*_last_success, sensor.mpc_pv_optim_status, input_select.effective_storage_mode, input_number.effective_charge_limit/_discharge_limit, select.solaredge_i1_storage_command_mode/_control_mode, number.solaredge_i1_storage_charge_limit/_discharge_limit  →  hassio.addon_restart, notify.mobile_app_fp3_ms, battery_forecast_control.yaml (Layer 4A output entities, fallback only), apply_effective_battery_control.yaml (automation.trigger, drift re-apply only)
# Fixes: known_issues_and_fixes.md (EMHASS Outage Fallback Guard; High SOC Hold - Charge Limit = 0 Does Not Stop Charging While Maximize Self Consumption Stays Active, Update 2026-11-02 - Battery Control Drift Watchdog); roadmap.md (Improve EMHASS Optimisation Failure Handling, Update 2026-10-10)

automation:

  - id: EMHASS_watchdog_dayahead_missing
    alias: "EMHASS Watchdog – Day‑ahead missing or failed"
    trigger:
      - platform: time_pattern
        minutes: "/15"

    condition:
    # Kör endast efter DA-fönstret
      - condition: time
        after: "00:15:00"

    # Ingen lyckad DA idag
      - condition: template
        value_template: >
          {% set last = states('input_datetime.emhass_dayahead_last_success') %}
          {% if last in ('unknown','unavailable','') %}
            true
          {% else %}
            {{ as_datetime(last).date() != now().date() }}
          {% endif %}

    action:
      - service: persistent_notification.create
        data:
          title: "⚠️ EMHASS Watchdog – Day‑ahead"
          message: >
            Day‑ahead optimization has NOT run successfully today.
            Status: {{ states('input_text.emhass_dayahead_status') }}
            Last success: {{ states('input_datetime.emhass_dayahead_last_success') }}
      - service: notify.mobile_app_fp3_ms
        data:
          title: "⚠️ EMHASS Watchdog – Day‑ahead"
          message: >
            Day‑ahead optimization has NOT run successfully today.
            Status: {{ states('input_text.emhass_dayahead_status') }}
            Last success: {{ states('input_datetime.emhass_dayahead_last_success') }}


  - id: EMHASS_watchdog_mpc_stalled
    alias: "EMHASS Watchdog – MPC stalled"
    description: >
      Notifies once MPC has been stalled/failed for over 45 minutes, and
      at the same time forces the Layer 4A requested mode to Maximize
      Self Consumption with wide-open 3300W limits (3300W - the same
      "full power" fallback value battery_forecast_control.yaml and
      batterycontrol_sensors.yaml's dynamic limit sensors already use
      elsewhere, e.g. dynamic_storage_discharge_limit's own
      last_discharge_limit | float(3300) fallback). Rationale: the
      forecast-driven requested mode/limits that Layer 4A
      (battery_forecast_control.yaml) froze at their last-computed values
      when it started skipping its run (see known_issues_and_fixes.md -
      EMHASS Outage Fallback Guard) are increasingly likely to no longer
      match current price/PV/load conditions the longer the stall
      continues - especially if the frozen mode was a directional one
      (charge_from_solar_and_grid, discharge_to_maximize_export) rather
      than the self-adapting maximize_self_consumption, which balances
      PV against house load live and doesn't depend on EMHASS forecasts
      at all. Guarded against redundant writes once already in the
      fallback state, so this re-fires the notification every 15 minutes
      the stall continues but only re-writes the mode/limits on a real
      change. Layer 1 safety overrides (safety_limits_and_override.yaml)
      still apply on top of this unchanged - SOC floor/ceiling protection
      is never affected by what Layer 4A requests. Self-healing: as soon
      as EMHASS recovers, battery_forecast_control.yaml's own guard
      unblocks and overwrites these on its next normal 15-minute run, the
      same way it always has.
      See roadmap.md - Improve EMHASS Optimisation Failure Handling,
      Update 2026-10-10.
    trigger:
      - platform: time_pattern
        minutes: "/15"
    condition:
      - condition: template
        value_template: >
          {{ (now().timestamp() - as_timestamp(states('input_datetime.emhass_mpc_last_success'))) > 2700 }}

    action:
      - service: persistent_notification.create
        data:
          title: "⚠️ EMHASS Watchdog – MPC stalled"
          message: >
            MPC has not run successfully in over 45 minutes.
            Status: {{ states('sensor.mpc_pv_optim_status') }}
            Last success: {{ states('input_datetime.emhass_mpc_last_success') }}
            Requested storage mode is being held at Maximize Self
            Consumption (3300W limits) until EMHASS recovers.
      - service: notify.mobile_app_fp3_ms
        data:
          title: "⚠️ EMHASS MPC stalled"
          message: >
            MPC has not run successfully in over 45 minutes - falling
            back to Maximize Self Consumption (3300W limits) until it
            recovers.
            Status: {{ states('sensor.mpc_pv_optim_status') }}
            Last changed: {{ states.sensor.emhass_mpc_last_success }}
      - choose:
          - conditions:
              # Avoid redundant writes once already in the fallback state
              - condition: not
                conditions:
                  - condition: state
                    entity_id: input_select.emhass_requested_storage_mode
                    state: "maximize_self_consumption"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.emhass_requested_storage_mode
                data:
                  option: "maximize_self_consumption"
              - service: input_number.set_value
                target:
                  entity_id: input_number.emhass_requested_charge_limit
                data:
                  value: 3300
              - service: input_number.set_value
                target:
                  entity_id: input_number.emhass_requested_discharge_limit
                data:
                  value: 3300

  - id: EMHASS_addon_watchdog_auto_restart
    alias: "EMHASS Watchdog – Addon Auto-Restart"
    description: >
      Escalation beyond the plain MPC-stalled notification above: after 90
      minutes of MPC stall, restarts the EMHASS addon (hassio.addon_restart),
      rate-limited to once per hour, and notifies either way.
      See known_issues_and_fixes.md - EMHASS Outage Fallback Guard.
    trigger:
      - platform: time_pattern
        minutes: "/15"
    condition:
      - condition: template
        value_template: >
          {{ (now().timestamp() - as_timestamp(states('input_datetime.emhass_mpc_last_success'))) > 5400 }}
      - condition: template
        value_template: >
          {{ (now().timestamp() - as_timestamp(states('input_datetime.emhass_addon_last_restart_attempt'), 0)) > 3600 }}
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.emhass_addon_last_restart_attempt
        data:
          timestamp: "{{ now().timestamp() }}"
      - service: hassio.addon_restart
        data:
          addon: 5b918bf2_emhass
      - service: persistent_notification.create
        data:
          title: "⚠️ EMHASS Watchdog – Addon auto-restarted"
          message: >
            MPC has not run successfully in over 90 minutes. Attempted an
            automatic restart of the EMHASS addon
            ({{ states('input_datetime.emhass_addon_last_restart_attempt') }}).
            If this keeps recurring, the addon likely needs manual attention
            (check its Supervisor logs) - this will retry at most once per
            hour.
      - service: notify.mobile_app_fp3_ms
        data:
          title: "⚠️ EMHASS Addon auto-restarted"
          message: >
            MPC stalled >90min - EMHASS addon was just auto-restarted.
            Will retry at most once/hour if it keeps failing.

  # Added 2026-11-02 - closes the gap identified the same day: the apply
  # automation (apply_effective_battery_control.yaml) only runs when one of
  # the effective_* entities CHANGES STATE, so nothing previously noticed or
  # corrected the live inverter silently drifting away afterwards (observed:
  # select.solaredge_i1_storage_command_mode reverted from "Discharge to
  # Minimize Import" to "Maximize Self Consumption" 15 minutes after a
  # correct apply, with no project-side trigger - see
  # known_issues_and_fixes.md - High SOC Hold - Charge Limit = 0 Does Not
  # Stop Charging While Maximize Self Consumption Stays Active, Update
  # 2026-11-02). This automation periodically compares the live inverter
  # registers against the intended effective_* values and, on a mismatch,
  # counts/logs/notifies and force-re-applies via automation.trigger rather
  # than duplicating apply_effective_battery_control.yaml's script-dispatch
  # logic here. Not yet verified live against a real drift event.
  - id: battery_control_drift_watchdog
    alias: "Watchdog – Battery Control Drift"
    description: >
      Detects drift between the intended effective battery control state
      (input_select.effective_storage_mode, input_number.effective_charge_limit,
      input_number.effective_discharge_limit) and the live SolarEdge
      inverter registers, and force-re-applies
      apply_effective_battery_control_to_solaredge_inverter when they
      disagree. Runs every 5 minutes; only acts while the killswitch is on
      and the inverter is in Remote Control, mirroring that automation's
      own condition (no point flagging - or trying to fix - drift it has
      no authority to correct anyway).
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: input_boolean.effective_battery_control_enabled
        state: "on"
      - condition: state
        entity_id: select.solaredge_i1_storage_control_mode
        state: "Remote Control"
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.solaredge_b1_state_of_energy
            state:
              - "unavailable"
              - "unknown"
    variables:
      expected_mode: "{{ states('input_select.effective_storage_mode') }}"
      # Same mapping as script.modbus_queue's write_expected_value in
      # solaredge_modbusqueue.yaml - keep these two in sync if either
      # one changes.
      expected_mode_text: >-
        {% set map = {
          'solar_power_only': 'Solar Power Only (Off)',
          'charge_from_clipped_solar': 'Charge from Clipped Solar Power',
          'charge_from_solar_and_grid': 'Charge from Solar Power and Grid',
          'discharge_to_maximize_export': 'Discharge to Maximize Export',
          'discharge_to_minimize_import': 'Discharge to Minimize Import',
          'maximize_self_consumption': 'Maximize Self Consumption'
        } %}
        {{ map.get(expected_mode, 'unknown') }}
      live_mode_text: "{{ states('select.solaredge_i1_storage_command_mode') }}"
      expected_charge: "{{ states('input_number.effective_charge_limit') | float(0) }}"
      expected_discharge: "{{ states('input_number.effective_discharge_limit') | float(0) }}"
      live_charge: "{{ states('number.solaredge_i1_storage_charge_limit') | float(0) }}"
      live_discharge: "{{ states('number.solaredge_i1_storage_discharge_limit') | float(0) }}"
      # Tolerance in watts - avoids flagging cosmetic rounding differences
      # the Modbus register's own resolution can introduce.
      tolerance: 50
      mode_drift: "{{ live_mode_text != expected_mode_text and expected_mode_text != 'unknown' }}"
      charge_drift: "{{ (live_charge - expected_charge) | abs > tolerance }}"
      discharge_drift: "{{ (live_discharge - expected_discharge) | abs > tolerance }}"
      drift_reason: >-
        {% if mode_drift %}
          mode: expected '{{ expected_mode_text }}', live '{{ live_mode_text }}'
        {% elif charge_drift %}
          charge limit: expected {{ expected_charge }}W, live {{ live_charge }}W
        {% elif discharge_drift %}
          discharge limit: expected {{ expected_discharge }}W, live {{ live_discharge }}W
        {% else %}
          none
        {% endif %}

    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ mode_drift or charge_drift or discharge_drift }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.battery_control_drift_count_total
                data:
                  value: "{{ (states('input_number.battery_control_drift_count_total') | float(0)) + 1 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.battery_control_drift_count_today
                data:
                  value: "{{ (states('input_number.battery_control_drift_count_today') | float(0)) + 1 }}"
              - service: input_text.set_value
                target:
                  entity_id: input_text.battery_control_last_drift_reason
                data:
                  value: "{{ now().isoformat() }} - {{ drift_reason | trim }}"
              - service: persistent_notification.create
                data:
                  title: "⚠️ Battery Control Drift Watchdog"
                  message: >
                    Live inverter state doesn't match the intended effective
                    battery control state - re-applying.
                    {{ drift_reason | trim }}
              - service: notify.mobile_app_fp3_ms
                data:
                  title: "⚠️ Battery control drift - re-applying"
                  message: "{{ drift_reason | trim }}"
              - service: automation.trigger
                target:
                  entity_id: automation.apply_effective_battery_control_to_solaredge_inverter
                data:
                  skip_condition: false

  - id: reset_watchdog_daily_counters
    alias: "Watchdog – Reset Daily Diagnostic Counters"
    description: >
      Enhanced Diagnostics: resets the "_today" Modbus write, mode-command
      skip, and battery control drift counters at midnight, mirroring
      reset_modbus_queue_daily_counters in solaredge_modbusqueue.yaml. The
      "_total" counters are never reset.
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - service: input_number.set_value
        target:
          entity_id:
            - input_number.modbus_write_success_count_today
            - input_number.modbus_write_failure_count_today
            - input_number.mode_command_skipped_count_today
            - input_number.battery_control_drift_count_today
        data:
          value: 0