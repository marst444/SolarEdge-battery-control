# ── watchdog_automations.yaml ──
# Layer 1: notifies on missing day-ahead run; notifies AND forces Maximize Self Consumption fallback after 45 min MPC stall; auto-restarts EMHASS addon after 90 min stall (max 1/hr); detects and LOGS live inverter drift from the intended effective battery control state (record-only as of 2026-11-03 - no longer force-re-applies, see known_issues_and_fixes.md; 180s settle window after intended changes as of 2026-11-21); resets daily diagnostic counters at midnight.
# Sets: input_datetime.emhass_addon_last_restart_attempt, input_number.modbus_write_success_count_today/_failure_count_today/mode_command_skipped_count_today/battery_control_drift_count_total/_today, input_text.battery_control_last_drift_reason, input_boolean.battery_control_drift_active, input_select.emhass_requested_storage_mode, input_number.emhass_requested_charge_limit/_discharge_limit (fallback only)
# Deps: input_datetime.emhass_*_last_success, sensor.mpc_pv_optim_status, input_select.effective_storage_mode, input_number.effective_charge_limit/_discharge_limit, select.solaredge_i1_storage_command_mode/_control_mode, number.solaredge_i1_storage_charge_limit/_discharge_limit  →  hassio.addon_restart, notify.mobile_app_fp3_ms, battery_forecast_control.yaml (Layer 4A output entities, fallback only). NOTE: as of 2026-11-03 the drift watchdog NO LONGER calls automation.trigger on apply_effective_battery_control.yaml - it only records. See known_issues_and_fixes.md.
# Fixes: known_issues_and_fixes.md (EMHASS Outage Fallback Guard; High SOC Hold - Charge Limit = 0 Does Not Stop Charging While Maximize Self Consumption Stays Active, Update 2026-11-02 - Battery Control Drift Watchdog; Update 2026-11-03 - Drift Watchdog Made Record-Only; Update 2026-11-09 - SOC-guard removed and drift_reason now reports every mismatched category per tick, mobile push now edge-triggered per episode; Update 2026-11-21 - settle window suppresses MPC-tick race false positives); roadmap.md (Improve EMHASS Optimisation Failure Handling, Update 2026-10-10)

automation:

  - id: EMHASS_watchdog_dayahead_missing
    alias: "EMHASS Watchdog – Day‑ahead missing or failed"
    trigger:
      - platform: time_pattern
        minutes: "/15"

    condition:
    # Kör endast efter DA-fönstret
      - condition: time
        after: "00:15:00"

    # Ingen lyckad DA idag
      - condition: template
        value_template: >
          {% set last = states('input_datetime.emhass_dayahead_last_success') %}
          {% if last in ('unknown','unavailable','') %}
            true
          {% else %}
            {{ as_datetime(last).date() != now().date() }}
          {% endif %}

    action:
      - service: persistent_notification.create
        data:
          title: "⚠️ EMHASS Watchdog – Day‑ahead"
          message: >
            Day‑ahead optimization has NOT run successfully today.
            Status: {{ states('input_text.emhass_dayahead_status') }}
            Last success: {{ states('input_datetime.emhass_dayahead_last_success') }}
      - service: notify.mobile_app_fp3_ms
        data:
          title: "⚠️ EMHASS Watchdog – Day‑ahead"
          message: >
            Day‑ahead optimization has NOT run successfully today.
            Status: {{ states('input_text.emhass_dayahead_status') }}
            Last success: {{ states('input_datetime.emhass_dayahead_last_success') }}


  - id: EMHASS_watchdog_mpc_stalled
    alias: "EMHASS Watchdog – MPC stalled"
    description: >
      Notifies once MPC has been stalled/failed for over 45 minutes, and
      at the same time forces the Layer 4A requested mode to Maximize
      Self Consumption with wide-open 3300W limits (3300W - the same
      "full power" fallback value battery_forecast_control.yaml and
      batterycontrol_sensors.yaml's dynamic limit sensors already use
      elsewhere, e.g. dynamic_storage_discharge_limit's own
      last_discharge_limit | float(3300) fallback). Rationale: the
      forecast-driven requested mode/limits that Layer 4A
      (battery_forecast_control.yaml) froze at their last-computed values
      when it started skipping its run (see known_issues_and_fixes.md -
      EMHASS Outage Fallback Guard) are increasingly likely to no longer
      match current price/PV/load conditions the longer the stall
      continues - especially if the frozen mode was a directional one
      (charge_from_solar_and_grid, discharge_to_maximize_export) rather
      than the self-adapting maximize_self_consumption, which balances
      PV against house load live and doesn't depend on EMHASS forecasts
      at all. Guarded against redundant writes once already in the
      fallback state, so this re-fires the notification every 15 minutes
      the stall continues but only re-writes the mode/limits on a real
      change. Layer 1 safety overrides (safety_limits_and_override.yaml)
      still apply on top of this unchanged - SOC floor/ceiling protection
      is never affected by what Layer 4A requests. Self-healing: as soon
      as EMHASS recovers, battery_forecast_control.yaml's own guard
      unblocks and overwrites these on its next normal 15-minute run, the
      same way it always has.
      See roadmap.md - Improve EMHASS Optimisation Failure Handling,
      Update 2026-10-10.
    trigger:
      - platform: time_pattern
        minutes: "/15"
    condition:
      - condition: template
        value_template: >
          {{ (now().timestamp() - as_timestamp(states('input_datetime.emhass_mpc_last_success'))) > 2700 }}

    action:
      - service: persistent_notification.create
        data:
          title: "⚠️ EMHASS Watchdog – MPC stalled"
          message: >
            MPC has not run successfully in over 45 minutes.
            Status: {{ states('sensor.mpc_pv_optim_status') }}
            Last success: {{ states('input_datetime.emhass_mpc_last_success') }}
            Requested storage mode is being held at Maximize Self
            Consumption (3300W limits) until EMHASS recovers.
      - service: notify.mobile_app_fp3_ms
        data:
          title: "⚠️ EMHASS MPC stalled"
          message: >
            MPC has not run successfully in over 45 minutes - falling
            back to Maximize Self Consumption (3300W limits) until it
            recovers.
            Status: {{ states('sensor.mpc_pv_optim_status') }}
            Last changed: {{ states.sensor.emhass_mpc_last_success }}
      - choose:
          - conditions:
              # Avoid redundant writes once already in the fallback state
              - condition: not
                conditions:
                  - condition: state
                    entity_id: input_select.emhass_requested_storage_mode
                    state: "maximize_self_consumption"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.emhass_requested_storage_mode
                data:
                  option: "maximize_self_consumption"
              - service: input_number.set_value
                target:
                  entity_id: input_number.emhass_requested_charge_limit
                data:
                  value: 3300
              - service: input_number.set_value
                target:
                  entity_id: input_number.emhass_requested_discharge_limit
                data:
                  value: 3300

  - id: EMHASS_addon_watchdog_auto_restart
    alias: "EMHASS Watchdog – Addon Auto-Restart"
    description: >
      Escalation beyond the plain MPC-stalled notification above: after 90
      minutes of MPC stall, restarts the EMHASS addon (hassio.addon_restart),
      rate-limited to once per hour, and notifies either way.
      See known_issues_and_fixes.md - EMHASS Outage Fallback Guard.
    trigger:
      - platform: time_pattern
        minutes: "/15"
    condition:
      - condition: template
        value_template: >
          {{ (now().timestamp() - as_timestamp(states('input_datetime.emhass_mpc_last_success'))) > 5400 }}
      - condition: template
        value_template: >
          {{ (now().timestamp() - as_timestamp(states('input_datetime.emhass_addon_last_restart_attempt'), 0)) > 3600 }}
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.emhass_addon_last_restart_attempt
        data:
          timestamp: "{{ now().timestamp() }}"
      - service: hassio.addon_restart
        data:
          addon: 5b918bf2_emhass
      - service: persistent_notification.create
        data:
          title: "⚠️ EMHASS Watchdog – Addon auto-restarted"
          message: >
            MPC has not run successfully in over 90 minutes. Attempted an
            automatic restart of the EMHASS addon
            ({{ states('input_datetime.emhass_addon_last_restart_attempt') }}).
            If this keeps recurring, the addon likely needs manual attention
            (check its Supervisor logs) - this will retry at most once per
            hour.
      - service: notify.mobile_app_fp3_ms
        data:
          title: "⚠️ EMHASS Addon auto-restarted"
          message: >
            MPC stalled >90min - EMHASS addon was just auto-restarted.
            Will retry at most once/hour if it keeps failing.

  # Added 2026-11-02 - closes the gap identified the same day: the apply
  # automation (apply_effective_battery_control.yaml) only runs when one of
  # the effective_* entities CHANGES STATE, so nothing previously noticed or
  # corrected the live inverter silently drifting away afterwards (observed:
  # select.solaredge_i1_storage_command_mode reverted from "Discharge to
  # Minimize Import" to "Maximize Self Consumption" 15 minutes after a
  # correct apply, with no project-side trigger - see
  # known_issues_and_fixes.md - High SOC Hold - Charge Limit = 0 Does Not
  # Stop Charging While Maximize Self Consumption Stays Active, Update
  # 2026-11-02).
  #
  # UPDATE 2026-11-03 - made RECORD-ONLY. This automation originally
  # force-re-applied apply_effective_battery_control_to_solaredge_inverter
  # via automation.trigger on every detected mismatch, every 5 minutes. The
  # user identified this as a likely cause of the Modbus/mode thrashing seen
  # all day 2026-11-03 (effective_storage_mode and the live inverter mode
  # flapping back and forth, drift counters climbing fast) - the watchdog
  # was repeatedly fighting the inverter back to the "intended" state every
  # time it drifted, which, combined with whatever was causing the drift in
  # the first place (see the AC-output-suppression investigation the same
  # day), produced sustained oscillation rather than a stable state. After
  # the user manually forced a discharge and the watchdog's re-apply call
  # was removed, the inverter settled into a steady discharge under
  # Maximize Self Consumption instead of the constant
  # charge/preserve-charge swings that had been going on all day - strong
  # live evidence that the forced re-apply, not just the underlying drift
  # cause, was part of the thrashing. The watchdog now ONLY counts, logs,
  # and notifies on drift - it no longer writes to the inverter in any way.
  # Re-establishing the intended state after real drift is now a manual
  # decision (re-trigger apply_effective_battery_control_to_solaredge_inverter
  # yourself, or just let the next real effective_* state change pick it
  # up) rather than an automatic one. See known_issues_and_fixes.md.
  #
  # NOTE: Home Assistant derives this automation's entity_id by slugifying
  # `alias:` below, NOT this `id:` key - the real entity_id is
  # automation.watchdog_battery_control_drift, not
  # automation.battery_control_drift_watchdog. Confirmed live 2026-11-02,
  # the same class of mismatch as Entity ID Documentation Mismatches
  # (Derived From Name/Alias, Not unique_id/id) in known_issues_and_fixes.md.
  - id: battery_control_drift_watchdog
    alias: "Watchdog – Battery Control Drift"
    description: >
      Detects drift between the intended effective battery control state
      (input_select.effective_storage_mode, input_number.effective_charge_limit,
      input_number.effective_discharge_limit) and the live SolarEdge
      inverter registers, and counts/logs/notifies when they disagree.
      RECORD-ONLY as of 2026-11-03 - it no longer calls automation.trigger
      on apply_effective_battery_control_to_solaredge_inverter or writes to
      the inverter in any way (see Update above - the forced re-apply was
      implicated in sustained mode-thrashing). Runs every 5 minutes; only
      evaluates while the killswitch is on and the inverter is in Remote
      Control, mirroring that automation's own condition (no point
      flagging drift in a state it has no authority over anyway).

      UPDATE 2026-11-09 - two fixes, per known_issues_and_fixes.md's
      2026-11-06 and 2026-11-09 Updates (both watchdog gaps confirmed via
      direct register-history reconstruction, not hypothetical):
      (1) the SOC-sensor-unavailable guard that used to gate this whole
      automation is REMOVED. None of mode_drift/charge_drift/
      discharge_drift below actually read the SOC sensor, so the guard
      was only ever blinding the watchdog during exactly the kind of
      connectivity event (see the 2026-11-06 ~35h outage) it most needs
      to catch - it never protected against a real dependency. (2)
      drift_reason now lists EVERY mismatched category each tick (joined
      with "; "), not just the highest-priority one from the old
      if/elif/elif chain - the 2026-11-09 check found this hiding up to
      two simultaneous real mismatches under a single "mode" entry.
      Per-tick counting/logging (counters, last_drift_reason,
      persistent_notification) is unchanged - still fires every 5-minute
      tick drift is present, exactly as before, just with the fuller
      drift_reason. The one thing that IS throttled: the
      notify.mobile_app_fp3_ms push. A sustained drift episode used to
      push once per 5-minute tick for its whole duration (e.g. 3-4 pushes
      for a single ~16-20min incident) - it now pushes once per NEW
      episode only (edge-triggered off input_boolean.
      battery_control_drift_active), and goes quiet again once the
      episode clears, so a long-running drift no longer spams the phone
      while still being fully logged/counted every tick.

      UPDATE 2026-11-21 - settle window. This /5 tick and the /15 MPC run
      fire on the same second; the apply write (~60s via the Modbus queue)
      plus the integration's ~70s poll lag means the first tick after any
      effective_* change always read the previous live value. 28 of 29
      ticks on 2026-11-20/21 were this race. Drift evaluation is now
      skipped for 180s after an intended change; a real drift that
      persists is still caught on the next tick, and real resets (e.g. the
      03:22 reconnect) don't coincide with MPC ticks anyway.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: input_boolean.effective_battery_control_enabled
        state: "on"
      - condition: state
        entity_id: select.solaredge_i1_storage_control_mode
        state: "Remote Control"
    variables:
      expected_mode: "{{ states('input_select.effective_storage_mode') }}"
      # Same mapping as script.modbus_queue's write_expected_value in
      # solaredge_modbusqueue.yaml - keep these two in sync if either
      # one changes.
      expected_mode_text: >-
        {% set map = {
          'solar_power_only': 'Solar Power Only (Off)',
          'charge_from_clipped_solar': 'Charge from Clipped Solar Power',
          'charge_from_solar_and_grid': 'Charge from Solar Power and Grid',
          'discharge_to_maximize_export': 'Discharge to Maximize Export',
          'discharge_to_minimize_import': 'Discharge to Minimize Import',
          'maximize_self_consumption': 'Maximize Self Consumption'
        } %}
        {{ map.get(expected_mode, 'unknown') }}
      live_mode_text: "{{ states('select.solaredge_i1_storage_command_mode') }}"
      expected_charge: "{{ states('input_number.effective_charge_limit') | float(0) }}"
      expected_discharge: "{{ states('input_number.effective_discharge_limit') | float(0) }}"
      live_charge: "{{ states('number.solaredge_i1_storage_charge_limit') | float(0) }}"
      live_discharge: "{{ states('number.solaredge_i1_storage_discharge_limit') | float(0) }}"
      # Tolerance in watts - avoids flagging cosmetic rounding differences
      # the Modbus register's own resolution can introduce.
      tolerance: 50
      # UPDATE 2026-11-21: settle window - see description. True for 180s
      # after any of the three intended-state entities last changed.
      settling: >-
        {% set lc = [states.input_select.effective_storage_mode.last_changed,
                     states.input_number.effective_charge_limit.last_changed,
                     states.input_number.effective_discharge_limit.last_changed] | max %}
        {{ (now() - lc).total_seconds() < 180 }}
      mode_drift: "{{ not settling and live_mode_text != expected_mode_text and expected_mode_text != 'unknown' }}"
      charge_drift: "{{ not settling and (live_charge - expected_charge) | abs > tolerance }}"
      discharge_drift: "{{ not settling and (live_discharge - expected_discharge) | abs > tolerance }}"
      # UPDATE 2026-11-09: used to be an if/elif/elif chain that only ever
      # reported ONE category per tick, in fixed mode > charge > discharge
      # priority order - a compound incident (e.g. mode+charge+discharge
      # all mismatched at once, seen live 2026-11-06 and again 2026-11-09)
      # was logged as if only the highest-priority category were wrong,
      # completely hiding the others. Now every mismatched category this
      # tick is listed, joined with "; ".
      drift_parts: >-
        {%- set parts = [] -%}
        {%- if mode_drift -%}
          {%- set parts = parts + ["mode: expected '" ~ expected_mode_text ~ "', live '" ~ live_mode_text ~ "'"] -%}
        {%- endif -%}
        {%- if charge_drift -%}
          {%- set parts = parts + ["charge limit: expected " ~ expected_charge ~ "W, live " ~ live_charge ~ "W"] -%}
        {%- endif -%}
        {%- if discharge_drift -%}
          {%- set parts = parts + ["discharge limit: expected " ~ expected_discharge ~ "W, live " ~ live_discharge ~ "W"] -%}
        {%- endif -%}
        {{ parts | join('; ') }}
      drift_reason: "{{ drift_parts if drift_parts | trim != '' else 'none' }}"

    action:
      - choose:
          # Any drift this tick: count/log/notify-in-app every single
          # time, exactly as before - this part is unchanged and still
          # fires every 5-minute tick the drift persists.
          - conditions:
              - condition: template
                value_template: "{{ mode_drift or charge_drift or discharge_drift }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.battery_control_drift_count_total
                data:
                  value: "{{ (states('input_number.battery_control_drift_count_total') | float(0)) + 1 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.battery_control_drift_count_today
                data:
                  value: "{{ (states('input_number.battery_control_drift_count_today') | float(0)) + 1 }}"
              - service: input_text.set_value
                target:
                  entity_id: input_text.battery_control_last_drift_reason
                data:
                  value: "{{ now().isoformat() }} - {{ drift_reason | trim }}"
              - service: persistent_notification.create
                data:
                  title: "⚠️ Battery Control Drift Watchdog"
                  message: >
                    Live inverter state doesn't match the intended effective
                    battery control state - logged only, NOT re-applying
                    (record-only as of 2026-11-03, see
                    known_issues_and_fixes.md).
                    {{ drift_reason | trim }}
              # UPDATE 2026-11-09: mobile push is now edge-triggered - only
              # sent the first tick of a NEW drift episode (i.e. the
              # episode-tracking boolean was still "off"), not on every
              # 5-minute tick for as long as the same episode continues.
              # Before this, a single 16-20min incident could push 3-4
              # near-identical notifications to the phone; now it's one
              # push per episode, while the in-app log/counters above
              # keep recording every tick so nothing is lost for later
              # analysis.
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: input_boolean.battery_control_drift_active
                        state: "off"
                    sequence:
                      - service: notify.mobile_app_fp3_ms
                        data:
                          title: "⚠️ Battery control drift (record-only)"
                          message: "{{ drift_reason | trim }}"
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.battery_control_drift_active
              # Removed 2026-11-03: this used to call automation.trigger on
              # apply_effective_battery_control_to_solaredge_inverter here,
              # forcing a re-apply every 5 minutes on any detected drift.
              # Implicated in sustained Modbus/mode thrashing - see the
              # Update note above this automation's `id:` and
              # known_issues_and_fixes.md. If you want the old
              # force-re-apply behavior back, the removed step was:
              #   - service: automation.trigger
              #     target:
              #       entity_id: automation.apply_effective_battery_control_to_solaredge_inverter
              #     data:
              #       skip_condition: false
          # No drift this tick: if an episode was active, it just cleared -
          # turn the tracking boolean off so the NEXT new episode (whenever
          # it starts) is treated as new and pushes to the phone again.
          - conditions:
              - condition: state
                entity_id: input_boolean.battery_control_drift_active
                state: "on"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.battery_control_drift_active

  - id: reset_watchdog_daily_counters
    alias: "Watchdog – Reset Daily Diagnostic Counters"
    description: >
      Enhanced Diagnostics: resets the "_today" Modbus write, mode-command
      skip, and battery control drift counters at midnight, mirroring
      reset_modbus_queue_daily_counters in solaredge_modbusqueue.yaml. The
      "_total" counters are never reset.
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - service: input_number.set_value
        target:
          entity_id:
            - input_number.modbus_write_success_count_today
            - input_number.modbus_write_failure_count_today
            - input_number.mode_command_skipped_count_today
            - input_number.battery_control_drift_count_today
        data:
          value: 0